<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판매 — ColdStorage</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/common.js"></script>
<script src="/api.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { font-family: 'Pretendard', sans-serif; }
  .nav-link { display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;color:#94a3b8;font-size:13px;font-weight:500;transition:all .15s; }
  .nav-link:hover { background:#334155;color:#e2e8f0; }
  .nav-link.active { background:#1d4ed8;color:#fff; }
  .status-badge { display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600; }
  .s-draft      { background:#dbeafe;color:#1d4ed8; }
  .s-ordered    { background:#ffedd5;color:#c2410c; }
  .s-partial    { background:#fef9c3;color:#854d0e; }
  .s-shipped    { background:#ede9fe;color:#6d28d9; }
  .s-done       { background:#dcfce7;color:#15803d; }
  .s-cancelled  { background:#fee2e2;color:#dc2626; }
  .row-sel      { background:#eff6ff!important; }
  ::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .item-row input { border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:12px;width:100%; }
  .item-row input:focus { outline:none;border-color:#3b82f6; }
  #drawing-frame { position:fixed;inset:0;z-index:100;background:#00000088;display:none; }
  #drawing-frame iframe { position:absolute;top:5%;left:5%;width:90%;height:90%;border-radius:12px;border:none; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

<!-- ─── Sidebar ─────────────────────────────────────────── -->
<aside class="w-52 bg-slate-800 flex flex-col shrink-0">
  <div class="p-4 border-b border-slate-700">
    <div class="text-white font-bold text-sm">❄️ ColdStorage</div>
    <div class="text-slate-400 text-xs mt-0.5">한남냉동테크(주)</div>
  </div>
  <nav class="flex-1 p-3 flex flex-col gap-1 overflow-y-auto">
    <a href="/" class="nav-link">🏠 대시보드</a>
    <a href="/orders.html" class="nav-link active">📋 판매</a>
    <a href="/purchases.html" class="nav-link">🛒 구매</a>
    <a href="/customers.html" class="nav-link">👤 고객</a>
    <a href="/as.html" class="nav-link">🔧 A/S</a>
    <a href="/payments.html" class="nav-link">💰 입금</a>
    <a href="/products.html" class="nav-link">📦 상품</a>
    <div class="mt-auto pt-3 border-t border-slate-700">
      <a href="/drawing_app.html" target="_blank" class="nav-link">✏️ 도면 설계 ↗</a>
      <a href="/logout" class="nav-link">🚪 로그아웃</a>
    </div>
  </nav>
</aside>

<!-- ─── Main ──────────────────────────────────────────────── -->
<div class="flex-1 flex overflow-hidden">

  <!-- 목록 -->
  <div class="w-[420px] shrink-0 flex flex-col border-r border-slate-200 bg-white">
    <!-- 헤더 -->
    <div class="p-4 border-b border-slate-100">
      <div class="flex items-center justify-between mb-2">
        <h1 class="font-bold text-base">판매</h1>
        <button onclick="openNewModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-blue-700">+ 새 판매</button>
      </div>
      <!-- 묶음 처리 버튼 -->
      <div class="flex gap-2 mb-2">
        <button onclick="openShipBatchModal()" class="flex-1 text-xs px-2 py-1.5 border border-purple-200 text-purple-700 bg-purple-50 rounded-lg hover:bg-purple-100">🚚 출고 묶음</button>
        <button onclick="openCompletionBatchModal()" class="flex-1 text-xs px-2 py-1.5 border border-green-200 text-green-700 bg-green-50 rounded-lg hover:bg-green-100">✅ 완료 묶음</button>
      </div>
      <!-- 필터 탭 -->
      <div class="flex gap-1 flex-wrap" id="filter-tabs">
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-white" data-s="all">전체</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="draft">견적</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="ordered">주문</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="partial">부분출고</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="shipped">출고</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="done">완료</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="cancelled">취소</button>
      </div>
      <!-- 검색 / 기간 — 지금까지 고객명이나 판매번호로 찾을 방법이 없었다 -->
      <input id="search" type="text" placeholder="고객, 판매번호, 품목 검색…" autocomplete="off"
             class="w-full mt-2 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      <div class="flex items-center gap-1 mt-2">
        <input id="from" type="date" class="flex-1 min-w-0 border border-slate-200 rounded px-2 py-1 text-xs">
        <span class="text-xs text-slate-400">~</span>
        <input id="to" type="date" class="flex-1 min-w-0 border border-slate-200 rounded px-2 py-1 text-xs">
        <button onclick="clearFilters()" title="검색 조건 지우기"
                class="text-xs px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 text-slate-500">초기화</button>
        <button onclick="exportOrders()" title="현재 조건으로 엑셀(CSV) 내보내기"
                class="text-xs px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 text-slate-500">CSV</button>
      </div>
    </div>
    <!-- 목록 -->
    <div id="order-list" class="flex-1 overflow-y-auto divide-y divide-slate-50"></div>
  </div>

  <!-- 상세 패널 -->
  <div class="flex-1 flex flex-col overflow-hidden bg-slate-50" id="detail-panel">
    <div class="flex-1 flex items-center justify-center text-slate-400 text-sm" id="empty-state">
      ← 왼쪽에서 주문을 선택하세요
    </div>
    <div class="flex-1 flex flex-col overflow-hidden hidden" id="detail-content"></div>
  </div>
</div>

<!-- ─── 도면 iframe 오버레이 ───────────────────────────────── -->
<div id="drawing-frame">
  <iframe id="drawing-iframe" src=""></iframe>
  <button onclick="closeDrawing()" class="absolute top-6 right-8 text-white text-2xl font-bold hover:text-slate-200">✕</button>
</div>

<!-- ─── 새 판매 모달 (탭: 신규/견적조합) ──────────────────── -->
<div id="new-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[580px] max-h-[85vh] overflow-y-auto shadow-xl">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-base">새 판매 작성</h2>
      <button onclick="closeNewModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <!-- 탭 헤더 -->
    <div class="flex gap-1 border-b border-slate-200 mb-4">
      <button id="new-tab-plain" onclick="switchNewTab('plain')" class="px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600 -mb-px">신규 생성</button>
      <button id="new-tab-compose" onclick="switchNewTab('compose')" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 -mb-px">견적서 조합</button>
    </div>
    <!-- 신규 생성 탭 -->
    <div id="new-panel-plain">
      <div class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">거래처</label>
          <!-- 목록에 없으면 여기서 바로 등록한다 (customerPicker) -->
          <div id="new-cust"></div>
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">현장명 (선택)</label>
          <input id="new-site" type="text" placeholder="같은 거래처의 다른 현장을 구분합니다" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">판매 번호</label>
            <input id="new-no" type="text" placeholder="자동 생성" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">날짜</label>
            <input id="new-date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
          </div>
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">메모 (선택)</label>
          <input id="new-memo" type="text" placeholder="현장명, 품목 요약 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeNewModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">취소</button>
        <button onclick="guard(this, createOrder)" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">생성</button>
      </div>
    </div>
    <!-- 견적서 조합 탭 -->
    <div id="new-panel-compose" class="hidden">
      <div class="flex flex-col gap-3 mb-4">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">거래처</label>
          <div id="compose-cust"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">판매 번호</label>
            <input id="compose-no" type="text" placeholder="자동 생성" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">날짜</label>
            <input id="compose-date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
          </div>
        </div>
      </div>
      <div class="text-xs font-semibold text-slate-600 mb-2">견적서에서 품목 가져오기</div>
      <div id="compose-quotes-list" class="border border-slate-200 rounded-lg overflow-hidden mb-3 max-h-48 overflow-y-auto">
        <div class="p-3 text-sm text-slate-400 text-center">로딩 중...</div>
      </div>
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-semibold text-slate-600">추가 품목</div>
        <button onclick="addComposeItem()" class="text-xs px-2 py-1 border border-slate-200 rounded hover:bg-slate-50">+ 행 추가</button>
      </div>
      <div id="compose-extra-items" class="mb-3"></div>
      <div class="flex justify-end gap-2">
        <button onclick="closeNewModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">취소</button>
        <button onclick="guard(this, createFromQuotations)" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">주문서 생성</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── 출고 묶음 모달 ─────────────────────────────────────── -->
<div id="ship-batch-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[660px] max-h-[85vh] overflow-y-auto shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-base">출고 묶음 처리</h2>
      <button onclick="closeShipBatchModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <p class="text-xs text-slate-500 mb-3">주문서를 선택하고 각 품목의 이번 출고 수량을 입력하세요.</p>
    <div id="ship-batch-content"></div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">출고일</label>
        <input id="sb-date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">메모</label>
        <input id="sb-note" type="text" placeholder="메모" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="closeShipBatchModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">취소</button>
      <button onclick="guard(this, submitShipBatch)" class="px-4 py-2 text-sm bg-purple-600 text-white rounded-lg hover:bg-purple-700">출고 처리</button>
    </div>
  </div>
</div>

<!-- ─── 완료 묶음 모달 ─────────────────────────────────────── -->
<div id="completion-batch-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[560px] shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-base">완료 묶음 처리</h2>
      <button onclick="closeCompletionBatchModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <p class="text-xs text-slate-500 mb-3">출고 완료된 주문서를 선택해 일괄 완료 처리합니다.</p>
    <div id="completion-batch-content"></div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">완료 처리일</label>
        <input id="cb-date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">메모</label>
        <input id="cb-note" type="text" placeholder="메모" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="closeCompletionBatchModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">취소</button>
      <button onclick="guard(this, submitCompletionBatch)" class="px-4 py-2 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700">완료 처리</button>
    </div>
  </div>
</div>

<!-- ─── 거래 취소 모달 ─────────────────────────────────────── -->
<div id="cancel-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[420px] shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-base text-red-600">거래 취소</h2>
      <button onclick="closeCancelModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <p class="text-sm text-slate-600 mb-3">이 판매건을 취소 상태로 변경합니다.</p>
    <div>
      <label class="text-xs font-medium text-slate-500 mb-1 block">취소 사유 (선택)</label>
      <input id="cancel-reason" type="text" placeholder="고객 요청, 계약 해지 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-400">
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeCancelModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">돌아가기</button>
      <button onclick="guard(this, submitCancel)" class="px-4 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700">취소 처리</button>
    </div>
  </div>
</div>

<!-- 카탈로그에서 품목을 골라 넣는다. 카탈로그가 비어 있어도 저장할 때마다
     새 품목이 역등록되므로 쓸수록 채워진다. -->
<div id="catalog-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[640px] shadow-xl">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-base">카탈로그에서 가져오기</h2>
      <button onclick="closeCatalogModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <input id="cat-q" type="text" placeholder="품목명 · 규격으로 검색" oninput="renderCatalog()"
           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400 mb-3">
    <div class="border border-slate-200 rounded-lg max-h-72 overflow-y-auto">
      <table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500 sticky top-0">
          <tr><th class="p-2 w-8"></th><th class="p-2 text-left font-medium">품목명</th>
              <th class="p-2 text-left font-medium">규격</th><th class="p-2 text-left font-medium w-14">단위</th>
              <th class="p-2 text-right font-medium w-24">단가</th></tr>
        </thead>
        <tbody id="cat-tbody"></tbody>
      </table>
    </div>
    <div class="flex justify-between items-center mt-4">
      <span class="text-xs text-slate-400" id="cat-count"></span>
      <div class="flex gap-2">
        <button onclick="closeCatalogModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">닫기</button>
        <button onclick="insertFromCatalog()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">선택 항목 넣기</button>
      </div>
    </div>
  </div>
</div>

<!-- 자주 나가는 품목 묶음. 저장과 불러오기를 한 화면에 둔다. -->
<div id="tpl-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[560px] shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-base">품목 템플릿</h2>
      <button onclick="closeTplModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <div class="bg-slate-50 rounded-lg p-3 mb-4">
      <label class="text-xs text-slate-500 mb-1 block">지금 화면의 품목을 템플릿으로 저장</label>
      <div class="flex gap-2">
        <!-- common.js 의 Enter 위임 핸들러는 모달의 "마지막으로 보이는 버튼" 을 누른다.
             이 모달은 목록 아래 "닫기" 로 끝나서, 이름을 치고 Enter 하면 저장 대신
             모달이 닫혀 버린다. 여기서 먼저 받아 저장으로 보낸다. -->
        <input id="tpl-name" type="text" placeholder="예) 2평형 냉동창고 기본"
               onkeydown="if (event.key === 'Enter' && !event.isComposing) { event.stopPropagation(); event.preventDefault(); saveTemplate(); }"
               class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
        <button onclick="guard(this, saveTemplate)" class="px-4 py-2 text-sm bg-slate-700 text-white rounded-lg hover:bg-slate-800 whitespace-nowrap">저장</button>
      </div>
    </div>
    <div class="border border-slate-200 rounded-lg max-h-64 overflow-y-auto">
      <table class="w-full text-xs"><tbody id="tpl-tbody"></tbody></table>
    </div>
    <div class="flex justify-end mt-4">
      <button onclick="closeTplModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">닫기</button>
    </div>
  </div>
</div>

<script>
const API = '';
const STATUS_LABEL = SALES_STATUS_LABEL;   // common.js — cancelled 포함
const STATUS_CLS   = SALES_STATUS_CLS;
// cancelled 는 제외 — 취소는 사유를 남기는 "거래 취소" 버튼으로만 한다.
// 드롭다운에 두면 사유가 빈 취소건이 만들어진다.
const ALL_STATUSES = [
  {v:'draft',l:'견적'},{v:'ordered',l:'주문'},{v:'partial',l:'부분출고'},
  {v:'shipped',l:'출고'},{v:'done',l:'완료'},
];

let orders = [], customers = [], curFilter = 'all', curId = null, curItems = [], curPayments = [];
let products = [];   // 카탈로그. 저장할 때마다 새 품목이 역등록돼 늘어난다

// ─── 초기화 ──────────────────────────────────────────────────
async function init() {
  [orders, customers, products] = await Promise.all([
    api.get('/api/quotations'),
    api.get('/api/customers'),
    api.get('/api/products'),
  ]);
  orders.sort((a,b) => b.id - a.id);
  renderList();
  // const today = today() 로 자기 자신을 가려 TDZ 오류가 났고, 그 뒤 두 줄이
  // 실행되지 않아 새 판매 모달의 날짜가 비어 있었다.
  const d = today();
  // 거래처 칸 — 목록에 없으면 그 자리에서 등록할 수 있는 픽커를 쓴다
  ['new-cust','compose-cust'].forEach(id => customerPicker.mount(id, { customers }));
  document.getElementById('new-date').value = d;
  document.getElementById('compose-date').value = d;
}

let shownCount = PAGE_SIZE;
const val = id => document.getElementById(id)?.value.trim() || '';

function filtered() {
  const q = val('search'), from = val('from'), to = val('to');
  // 고객명은 quotations.customer 에 없을 수도 있어 customers 에서 찾아 함께 검색한다
  const custById = new Map(customers.map(c => [c.id, c.name]));
  return orders.filter(o =>
    (curFilter === 'all' || o.order_status === curFilter) &&
    inRange(o.date, from, to) &&
    matches(q, o.no, o.customer, custById.get(o.customer_id), o.items, o.created_by));
}

function applyFilters() { shownCount = PAGE_SIZE; renderList(); }
function showMore()     { shownCount += PAGE_SIZE; renderList(); }
function exportOrders() {
  exportCsv('quotations', { q: val('search'), from: val('from'), to: val('to'),
                            status: curFilter === 'all' ? '' : curFilter });
}

function renderList() {
  const list = document.getElementById('order-list');
  const rows = filtered();
  list.innerHTML = pagedHtml(rows, shownCount, o => {
    const unpaid = (o.total||0) - (o.total_paid||0);
    const cust = customers.find(c=>c.id===o.customer_id);
    const custName = cust ? cust.name : (o.customer || '—');
    return `<div class="p-3 cursor-pointer hover:bg-slate-50 ${curId===o.id?'row-sel':''}" onclick="selectOrder(${o.id})">
      <div class="flex items-center justify-between mb-1">
        <span class="font-medium text-sm truncate max-w-[180px]">${esc(custName)}</span>
        <span class="status-badge ${STATUS_CLS[o.order_status]||'s-draft'}">${STATUS_LABEL[o.order_status]||o.order_status}</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">${esc(o.no||'#'+o.id)} · ${esc(o.date||'')}</span>
        <div class="text-right">
          <div class="text-xs font-semibold text-slate-700">${(o.total||0).toLocaleString()}원</div>
          ${unpaid>0 && tracksUnpaid(o.order_status) ? `<div class="text-xs text-red-500">미수 ${num(unpaid)}원</div>` : ''}
        </div>
      </div>
      ${o.items ? `<div class="text-xs text-slate-400 mt-1 truncate">${esc(o.items)}</div>` : ''}
    </div>`;
  }, 'showMore', '조건에 맞는 판매 건이 없습니다.');
}

// ─── 필터 탭 ─────────────────────────────────────────────────
document.getElementById('filter-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  curFilter = btn.dataset.s;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = 'tab-btn px-3 py-1 rounded-full text-xs font-medium ' + (b===btn ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600');
  });
  applyFilters();
});

// 검색·기간 — 입력마다 전체를 다시 그리지 않도록 디바운스
document.getElementById('search').addEventListener('input', debounce(applyFilters, 180));
for (const id of ['from','to']) document.getElementById(id).addEventListener('change', applyFilters);

// ─── 주문 선택 ───────────────────────────────────────────────
async function selectOrder(id) {
  curId = id;
  renderList();
  const order = orders.find(o => o.id === id);
  if (!order) return;

  [curItems, curPayments] = await Promise.all([
    api.get(`/api/order_items/order/${id}`),
    api.get(`/api/payments/order/${id}`),
  ]);

  const cust = customers.find(c=>c.id===order.customer_id);
  const custName = cust ? cust.name : (order.customer || '—');
  const unpaid = (order.total||0) - (order.total_paid||0);
  const isCancelled = order.order_status === 'cancelled';
  const isDone = order.order_status === 'done';

  document.getElementById('empty-state').classList.add('hidden');
  const dc = document.getElementById('detail-content');
  dc.classList.remove('hidden');
  dc.innerHTML = `
    <!-- 헤더 -->
    <div class="p-5 border-b border-slate-200 bg-white">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="font-bold text-base">${esc(custName)}</span>
            <span class="status-badge ${STATUS_CLS[order.order_status]||'s-draft'}">${STATUS_LABEL[order.order_status]||order.order_status}</span>
          </div>
          <div class="text-xs text-slate-400">${esc(order.no||'#'+order.id)} · ${esc(order.date||'')} · ${esc(order.ref||'한남냉동테크(주)')}</div>
          ${order.site_name ? `<div class="text-xs text-slate-500 mt-0.5">📍 ${esc(order.site_name)}</div>` : ''}
          ${isCancelled && order.cancelled_reason ? `<div class="text-xs text-red-500 mt-0.5">취소 사유: ${esc(order.cancelled_reason)}</div>` : ''}
        </div>
        <div class="flex gap-2 flex-wrap justify-end">
          ${order.order_status === 'done' ? `
            <button onclick="guard(this, () => uncompleteOrder(${order.id}))" class="text-xs px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-200"
                    title="완료 처리를 되돌립니다 (출고 기록에 맞는 상태로 돌아갑니다)">완료 해제</button>
          ` : ''}
          ${isCancelled ? `
            <button onclick="uncancelOrder(${order.id})" class="text-xs px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-200">취소 해제</button>
          ` : order.order_status === 'done' ? '' /* 완료에서 나가는 길은 "완료 해제" 하나뿐 */ : `
            <select onchange="changeStatus(${order.id},this.value);this.value=''" class="text-xs px-2 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg cursor-pointer focus:outline-none focus:border-blue-400">
              <option value="">상태변경</option>
              ${ALL_STATUSES.filter(s=>s.v!==order.order_status).map(s=>`<option value="${s.v}">${s.l}</option>`).join('')}
            </select>
            <button onclick="openCancelModal(${order.id})" class="text-xs px-3 py-1.5 bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100">거래 취소</button>
          `}
          <button onclick="openDrawingModal(${order.id})"
                  class="text-xs px-3 py-1.5 border rounded-lg hover:bg-slate-50 ${order.drawing_id ? 'border-blue-300 text-blue-700 bg-blue-50' : 'border-slate-200'}"
                  title="${order.drawing_id ? '연결된 도면을 이어서 엽니다' : '도면을 설계해 품목을 가져옵니다'}">
            ✏️ ${order.drawing_id ? '도면 열기' : '도면 연동'}</button>
          <button onclick="guard(this, () => copyOrder(${order.id}))"
                  class="text-xs px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50"
                  title="같은 품목으로 새 견적을 만듭니다 (출고·입금은 가져오지 않습니다)">⧉ 복사</button>
          <a href="/print.html?id=${order.id}&type=quote" target="_blank"
             class="text-xs px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50">🖨 견적서</a>
          <a href="/print.html?id=${order.id}&type=statement" target="_blank"
             class="text-xs px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50">🖨 거래명세서</a>
        </div>
      </div>
      <!-- 금액 요약 — 공급가는 total/1.1 로 역산하던 값이라 실제와 달랐다.
           이제 서버가 품목에서 계산한 supply_amount/vat_amount 를 그대로 쓴다. -->
      <div class="grid grid-cols-5 gap-2 mt-4">
        <div class="bg-slate-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">공급가액</div>
          <div class="text-sm font-semibold">${num(order.supply_amount)}</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">부가세${order.exempt_amount ? ` <span class="text-slate-300">·면세 ${num(order.exempt_amount)}</span>` : ''}</div>
          <div class="text-sm font-semibold">${num(order.vat_amount)}</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">합계</div>
          <div class="text-sm font-semibold">${num(order.total)}</div>
        </div>
        <div class="bg-green-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">입금</div>
          <div class="text-sm font-semibold text-green-700">${(order.total_paid||0).toLocaleString()}</div>
        </div>
        <div class="bg-${unpaid>0?'red':'slate'}-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">미수금</div>
          <div class="text-sm font-semibold text-${unpaid>0?'red-600':'slate-400'}">${unpaid.toLocaleString()}</div>
        </div>
      </div>
    </div>

    <!-- 탭 -->
    <div class="border-b border-slate-200 bg-white px-5 flex gap-4" id="detail-tabs">
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600" data-tab="items">품목</button>
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-transparent text-slate-500" data-tab="payments">입금</button>
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-transparent text-slate-500" data-tab="shipments">출고</button>
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-transparent text-slate-500" data-tab="memo">메모</button>
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-transparent text-slate-500" data-tab="history">이력</button>
    </div>

    <!-- 탭 콘텐츠 -->
    <div class="flex-1 overflow-y-auto p-5" id="tab-content">
    </div>
  `;

  renderTab('items');

  document.getElementById('detail-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.detail-tab');
    if (!btn) return;
    document.querySelectorAll('.detail-tab').forEach(b => {
      b.className = 'detail-tab py-2 text-sm font-medium border-b-2 ' + (b===btn ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500');
    });
    renderTab(btn.dataset.tab);
  });
}

function renderTab(tab) {
  const tc = document.getElementById('tab-content');
  if (tab === 'items') renderItemsTab(tc);
  else if (tab === 'payments') renderPaymentsTab(tc);
  else if (tab === 'shipments') renderShipmentsTab(tc);
  else if (tab === 'memo') renderMemoTab(tc);
  else if (tab === 'history') renderHistoryTab(tc);
}

// ─── 이력 탭 ─────────────────────────────────────────────────
// status_changes / quotation_sources 는 그동안 쓰기만 하고 보는 곳이 없었다.
async function renderHistoryTab(tc) {
  const id = curId;
  tc.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">불러오는 중…</div>';
  let h;
  try { h = await api.get(`/api/quotations/${id}/history`); }
  catch { tc.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">이력을 불러오지 못했습니다.</div>'; return; }
  if (curId !== id) return;   // 그 사이 다른 주문을 골랐으면 버린다

  const order = orders.find(o => o.id === id);
  const src = h.sources?.length ? `
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-3">
      <div class="text-sm font-semibold mb-2">출처 견적</div>
      ${h.sources.map(s => `<div class="text-xs text-slate-600">
        ${esc(s.no || '#'+s.source_quotation_id)} · ${esc(s.date || '')} · ${esc(s.customer || '')}</div>`).join('')}
    </div>` : '';

  tc.innerHTML = `
    ${src}
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-3 text-xs text-slate-500">
      작성자 <span class="text-slate-700 font-medium">${esc(order?.created_by || '기록 없음')}</span>
      · 등록일 ${esc(order?.date || '')}
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      ${!h.changes.length ? '<div class="p-4 text-center text-slate-400 text-sm">상태 변경 이력 없음</div>' :
      `<table class="w-full text-xs"><thead class="bg-slate-50"><tr>
        <th class="p-2 text-left font-medium text-slate-500">일시</th>
        <th class="p-2 text-left font-medium text-slate-500">변경</th>
        <th class="p-2 text-left font-medium text-slate-500">처리자</th>
        <th class="p-2 text-left font-medium text-slate-500">사유</th>
      </tr></thead><tbody>${h.changes.map(c => `
        <tr class="border-t border-slate-50">
          <td class="p-2 text-slate-500 whitespace-nowrap">${esc(String(c.changed_at || '').replace('T',' ').slice(0,16))}</td>
          <td class="p-2 whitespace-nowrap">${statusBadge(c.from_status)} → ${statusBadge(c.to_status)}</td>
          <td class="p-2">${esc(c.user_name || '—')}</td>
          <td class="p-2 text-slate-500">${esc(c.reason || '')}</td>
        </tr>`).join('')}</tbody></table>`}
    </div>`;
}

// ─── 상태 변경 ───────────────────────────────────────────────
async function changeStatus(id, newStatus) {
  if (!newStatus) return;
  const o = orders.find(x => x.id === id);
  const unpaid = (o?.total || 0) - (o?.total_paid || 0);
  // 완료로 넘기면 미수금 현황에서 빠지므로 남은 금액을 먼저 알린다
  if (newStatus === 'done' && unpaid > 0 &&
      !confirm(`미수금 ${won(unpaid)} 이 남아 있습니다.\n완료 처리하시겠습니까?`)) {
    renderList(); await selectOrder(id); return;   // select 를 원래 값으로 되돌린다
  }
  if (!await tryApi(() => api.patch(`/api/quotations/${id}/status`, { status:newStatus }))) {
    renderList(); await selectOrder(id); return;
  }
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(id);
}

async function uncancelOrder(id) {
  if (!confirm('취소를 해제할까요?')) return;
  if (!await tryApi(() => api.patch(`/api/quotations/${id}/uncancel`), '취소가 해제됐습니다.')) return;
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(id);
}

async function uncompleteOrder(id) {
  if (!confirm('완료 처리를 되돌릴까요?\n출고 기록에 맞는 상태로 돌아갑니다.')) return;
  if (!await tryApi(() => api.patch(`/api/quotations/${id}/uncomplete`), '완료가 해제됐습니다.')) return;
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(id);
}

// ─── 거래 취소 ───────────────────────────────────────────────
let cancelTargetId = null;
function openCancelModal(id) { cancelTargetId = id; document.getElementById('cancel-reason').value = ''; document.getElementById('cancel-modal').classList.remove('hidden'); }
function closeCancelModal() { document.getElementById('cancel-modal').classList.add('hidden'); cancelTargetId = null; }

async function submitCancel() {
  const id = cancelTargetId;          // closeCancelModal() 이 null 로 만들므로 먼저 받아둔다
  if (!id) return;
  const reason = document.getElementById('cancel-reason').value.trim();
  if (!reason) return toast('취소 사유를 입력하세요.', 'error');
  if (!confirm('이 거래를 취소할까요?')) return;
  if (!await tryApi(() => api.patch(`/api/quotations/${id}/cancel`, { reason }), '취소됐습니다.')) return;
  closeCancelModal();
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(id);
}

// ─── 품목 탭 ─────────────────────────────────────────────────
function renderItemsTab(tc) {
  const order = orders.find(o => o.id === curId);
  const isDone = order?.order_status === 'done' || order?.order_status === 'cancelled';
  tc.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <span class="text-sm font-semibold">품목 목록</span>
        <label class="text-xs text-slate-500 flex items-center gap-1">
          단가 기준
          <select ${isDone ? 'disabled' : ''} onchange="changeTaxMode(this)"
                  class="text-xs border border-slate-200 rounded px-2 py-1 bg-white disabled:bg-slate-50">
            <option value="EXCLUSIVE"${order?.vat_mode !== 'INCLUSIVE' ? ' selected' : ''}>부가세 별도</option>
            <option value="INCLUSIVE"${order?.vat_mode === 'INCLUSIVE' ? ' selected' : ''}>부가세 포함</option>
          </select>
        </label>
        <label class="text-xs text-slate-500 flex items-center gap-1"
               title="문서 단위 할인 — 과세표준에서만 빼고 면세분은 그대로 둡니다">
          할인
          <input id="doc-discount" type="number" min="0" value="${order?.discount || 0}" ${isDone ? 'disabled' : ''}
                 style="width:90px;text-align:right"
                 class="text-xs border border-slate-200 rounded px-2 py-1 disabled:bg-slate-50"
                 onchange="guard(this, saveDiscount)">
        </label>
      </div>
      ${!isDone ? `<div class="flex gap-2">
        <button onclick="openCatalogModal()" class="text-xs px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-50"
                title="등록된 품목에서 골라 넣습니다">📦 카탈로그</button>
        <button onclick="openTplModal()" class="text-xs px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-50"
                title="자주 쓰는 품목 묶음을 저장하고 불러옵니다">📑 템플릿</button>
        <button onclick="addItemRow()" class="text-xs px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-50">+ 행 추가</button>
        <button onclick="guard(this, saveItems)" class="text-xs px-3 py-1 bg-blue-600 text-white rounded-lg hover:bg-blue-700">저장</button>
      </div>` : ''}
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500">
          <tr>
            <th class="p-2 text-left font-medium">품목명</th>
            <th class="p-2 text-left font-medium">규격</th>
            <th class="p-2 text-left font-medium">비고</th>
            <th class="p-2 text-right font-medium w-16">수량</th>
            <th class="p-2 text-left font-medium w-14">단위</th>
            <th class="p-2 text-right font-medium w-28">단가</th>
            <th class="p-2 text-right font-medium w-24">금액</th>
            <th class="p-2 text-center font-medium w-12">면세</th>
            <th class="p-2 text-right font-medium w-16">출고</th>
            ${!isDone ? '<th class="p-2 w-20"></th>' : ''}
          </tr>
        </thead>
        <tbody id="items-tbody">
          ${curItems.map((it,i) => itemRow(it, i, isDone)).join('')}
        </tbody>
      </table>
      <div class="border-t border-slate-100 bg-slate-50 p-3" id="items-summary">${itemsSummary(order)}</div>
    </div>
  `;
  if (!isDone) loadHints();
}

/* 합계는 서버 계산과 같은 규칙으로 화면에서도 보여준다.
 * 부가세는 문서 단위로 한 번만 계산한다 — 행별 세액을 합산하면
 * 세금계산서와 거래명세서가 1원씩 어긋난다. */
function calcTotals(order) {
  const rate = Number(order?.vat_rate);
  const vatRate = Number.isFinite(rate) && rate >= 0 ? rate : 0.1;
  const inclusive = order?.vat_mode === 'INCLUSIVE';
  let taxable = 0, exempt = 0;
  for (const it of curItems) {
    const amt = Math.round((Number(it.qty)||0) * (Number(it.unit_price)||0));
    if (it.tax_free) exempt += amt; else taxable += amt;
  }
  // 할인은 과세표준에서만 뺀다 (서버 recalcTotal 과 같은 규칙).
  // 여기서 빼지 않으면 할인이 걸린 건마다 "저장하지 않은 변경" 이 계속 뜬다.
  taxable = Math.max(0, taxable - (order?.discount || 0));
  let supply, vat;
  if (inclusive) { supply = Math.round(taxable / (1 + vatRate)); vat = taxable - supply; }
  else           { supply = taxable; vat = Math.floor(supply * vatRate); }
  return { supply, vat, exempt, total: inclusive ? taxable + exempt : supply + exempt + vat, vatRate, inclusive };
}

function itemsSummary(order) {
  const t = calcTotals(order);
  const saved = (order?.total || 0) !== t.total;
  return `
    <div class="flex justify-end gap-6 text-xs">
      <div><span class="text-slate-400">공급가액</span> <span class="font-semibold ml-1">${num(t.supply)}원</span></div>
      ${t.exempt ? `<div><span class="text-slate-400">면세</span> <span class="font-semibold ml-1">${num(t.exempt)}원</span></div>` : ''}
      <div><span class="text-slate-400">부가세 (${Math.round(t.vatRate*1000)/10}%)</span> <span class="font-semibold ml-1">${num(t.vat)}원</span></div>
      <div><span class="text-slate-400">합계</span> <span class="font-bold text-sm ml-1">${num(t.total)}원</span></div>
    </div>
    ${saved ? '<div class="text-right text-xs text-orange-500 mt-1">저장하지 않은 변경이 있습니다.</div>' : ''}`;
}

/** 과세 방식 변경 — 서버가 다시 계산해 준다 */
async function changeTaxMode(sel) {
  const prev = orders.find(o => o.id === curId)?.vat_mode || 'EXCLUSIVE';
  sel.disabled = true;
  const ok = await tryApi(() => api.patch(`/api/quotations/${curId}/tax`, { vat_mode: sel.value }),
                          '과세 방식을 변경했습니다.');
  sel.disabled = false;
  if (!ok) { sel.value = prev; return; }
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(curId);
}

/* 할인은 금액 캐시를 바꾸므로 /memo 가 아니라 /tax 로 보낸다.
 * 서버가 과세표준에서만 빼고 부가세까지 다시 계산한다. */
async function saveDiscount() {
  const v = Math.max(0, parseInt(document.getElementById('doc-discount').value, 10) || 0);
  if (!await tryApi(() => api.patch(`/api/quotations/${curId}/tax`, { discount: v }), '할인을 반영했습니다.')) return;
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(curId);
}

function itemRow(it, i, isDone) {
  const amt = (it.qty||0)*(it.unit_price||0);
  if (isDone) return `<tr class="border-t border-slate-50">
    <td class="p-2">${esc(it.name)}</td><td class="p-2 text-slate-500">${esc(it.spec||'')}</td>
    <td class="p-2 text-slate-500">${esc(it.note||'')}</td>
    <td class="p-2 text-right">${qty(it.qty)}</td><td class="p-2">${esc(it.unit)}</td>
    <td class="p-2 text-right">${(it.unit_price||0).toLocaleString()}</td>
    <td class="p-2 text-right">${amt.toLocaleString()}</td>
    <td class="p-2 text-center">${it.tax_free ? '면세' : ''}</td>
    <td class="p-2 text-right text-blue-600">${qty(it.shipped_qty)}</td>
  </tr>`;
  const last = curItems.length - 1;
  return `<tr class="item-row border-t border-slate-50" data-idx="${i}">
    <td class="p-1"><input value="${esc(it.name||'')}" placeholder="품목명" onchange="curItems[${i}].name=this.value;loadHint(${i})"></td>
    <td class="p-1"><input value="${esc(it.spec||'')}" placeholder="규격" onchange="curItems[${i}].spec=this.value;loadHint(${i})"></td>
    <td class="p-1"><input value="${esc(it.note||'')}" placeholder="비고" onchange="curItems[${i}].note=this.value"></td>
    <td class="p-1"><input type="number" value="${it.qty||0}" min="0" step="0.01" style="width:60px" onchange="curItems[${i}].qty=parseFloat(this.value)||0;updateAmounts()"></td>
    <td class="p-1"><input value="${esc(it.unit||'EA')}" style="width:50px" onchange="curItems[${i}].unit=this.value"></td>
    <td class="p-1 text-right">
      <input type="number" value="${it.unit_price||0}" min="0" style="width:90px;text-align:right" onchange="curItems[${i}].unit_price=parseInt(this.value)||0;updateAmounts()">
      <div class="text-[10px] text-slate-400 mt-0.5 h-3 leading-3" id="hint-${i}"></div>
    </td>
    <td class="p-2 text-right item-amt">${amt.toLocaleString()}</td>
    <td class="p-2 text-center"><input type="checkbox"${it.tax_free ? ' checked' : ''}
        title="면세 품목 — 과세표준에서 제외됩니다"
        onchange="curItems[${i}].tax_free = this.checked ? 1 : 0; updateAmounts()"></td>
    <td class="p-2 text-right text-blue-600">${qty(it.shipped_qty)}</td>
    <td class="p-1 text-center whitespace-nowrap">
      <button onclick="moveItem(${i},-1)" ${i === 0 ? 'disabled' : ''} title="위로"
              class="text-slate-300 hover:text-slate-600 disabled:opacity-20 disabled:hover:text-slate-300">↑</button>
      <button onclick="moveItem(${i},1)" ${i === last ? 'disabled' : ''} title="아래로"
              class="text-slate-300 hover:text-slate-600 disabled:opacity-20 disabled:hover:text-slate-300">↓</button>
      <button onclick="removeItem(${i})" class="text-slate-300 hover:text-red-400 text-base">×</button>
    </td>
  </tr>`;
}

/* 행 순서. sort_order 컬럼은 예전부터 있었지만 바꿀 방법이 없었다.
 * 저장할 때 서버가 배열 순서대로 sort_order 를 매긴다. */
function moveItem(i, d) {
  const j = i + d;
  if (j < 0 || j >= curItems.length) return;
  [curItems[i], curItems[j]] = [curItems[j], curItems[i]];
  renderTab('items');
}

/* 단가를 모르는 행에 "지난번엔 얼마였는지" 를 보여준다. 자동으로 채우지는
 * 않는다 — 일부러 0 으로 둔 행을 덮어쓰면 합계가 조용히 달라진다. */
async function loadHint(i) {
  const box = document.getElementById(`hint-${i}`);
  const it = curItems[i];
  if (!box || !it || !it.name) return;
  if (it.unit_price > 0) { box.innerHTML = ''; return; }
  let r;
  try { r = await api.get(`/api/price-hint?name=${encodeURIComponent(it.name)}&spec=${encodeURIComponent(it.spec||'')}`); }
  catch { return; }
  if (!r?.price) { box.innerHTML = ''; return; }
  const from = r.source === 'history' ? (r.at ? `${r.at} 견적` : '지난 견적') : '카탈로그';
  box.innerHTML = `<button onclick="applyHint(${i},${r.price})" class="text-blue-500 hover:underline"
                     title="${esc(from)}의 단가를 넣습니다">${r.price.toLocaleString()} 적용</button>`;
}

function applyHint(i, price) {
  curItems[i].unit_price = price;
  renderTab('items');
}

/** 단가가 비어 있는 행에만 힌트를 붙인다 */
function loadHints() {
  curItems.forEach((it, i) => { if (it.name && !(it.unit_price > 0)) loadHint(i); });
}

function updateAmounts() {
  document.querySelectorAll('.item-row').forEach((tr,i) => {
    const it = curItems[i];
    if (it) tr.querySelector('.item-amt').textContent = Math.round((it.qty||0)*(it.unit_price||0)).toLocaleString();
  });
  const box = document.getElementById('items-summary');
  if (box) box.innerHTML = itemsSummary(orders.find(o => o.id === curId));
}

function addItemRow() {
  curItems.push({ name:'', spec:'', unit:'EA', qty:0, unit_price:0, shipped_qty:0, note:'', tax_free:0 });
  renderTab('items');
}

// ─── 카탈로그 ────────────────────────────────────────────────
/* products 의 note 가 규격 자리다 (products 에는 spec 컬럼이 없다).
 * 넣고 뺄 때 양쪽에서 같은 매핑을 쓴다. */
const catSpec = p => p.note || '';

function openCatalogModal() {
  document.getElementById('cat-q').value = '';
  document.getElementById('catalog-modal').classList.remove('hidden');
  renderCatalog();
  document.getElementById('cat-q').focus();
}
function closeCatalogModal() { document.getElementById('catalog-modal').classList.add('hidden'); }

function renderCatalog() {
  const q = document.getElementById('cat-q').value.trim().toLowerCase();
  const hit = products.filter(p => !q ||
    `${p.name} ${catSpec(p)} ${p.cat1||''} ${p.cat2||''}`.toLowerCase().includes(q));
  document.getElementById('cat-tbody').innerHTML = hit.length ? hit.map(p => `
    <tr class="border-t border-slate-50 hover:bg-slate-50">
      <td class="p-2 text-center"><input type="checkbox" class="cat-pick" value="${p.id}"></td>
      <td class="p-2">${esc(p.name)}</td>
      <td class="p-2 text-slate-500">${esc(catSpec(p))}</td>
      <td class="p-2">${esc(p.unit||'EA')}</td>
      <td class="p-2 text-right">${(p.price||0).toLocaleString()}</td>
    </tr>`).join('')
    : `<tr><td colspan="5" class="p-6 text-center text-slate-400">
         ${products.length ? '검색 결과가 없습니다.'
           : '카탈로그가 비어 있습니다. 품목을 적고 저장하면 여기에 쌓입니다.'}</td></tr>`;
  document.getElementById('cat-count').textContent = `${hit.length} / ${products.length}건`;
}

function insertFromCatalog() {
  const ids = [...document.querySelectorAll('.cat-pick:checked')].map(c => parseInt(c.value, 10));
  if (!ids.length) return toast('넣을 품목을 고르세요.', 'error');
  ids.forEach(id => {
    const p = products.find(x => x.id === id);
    if (!p) return;
    curItems.push({ name: p.name, spec: catSpec(p), unit: p.unit || 'EA',
                    qty: 1, unit_price: p.price || 0, shipped_qty: 0, note: '', tax_free: 0 });
  });
  closeCatalogModal();
  renderTab('items');
  toast(`${ids.length}건을 넣었습니다.`);
}

/** 이 견적을 그대로 한 건 더. 새 번호·오늘 날짜·견적 상태로 시작한다. */
async function copyOrder(id) {
  const src = orders.find(o => o.id === id);
  if (!confirm(`"${src?.no || id}" 을 복사해 새 견적을 만듭니다.\n` +
               `품목·거래처·메모는 가져오고, 출고·입금 기록은 가져오지 않습니다.\n\n계속할까요?`)) return;
  const r = await tryApi(() => api.post(`/api/quotations/${id}/copy`, {}));
  if (!r) return;
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(r.id);
  toast(`${r.no} 로 복사했습니다.`);
}

// ─── 품목 템플릿 ─────────────────────────────────────────────
let templates = [];

async function openTplModal() {
  document.getElementById('tpl-name').value = '';
  document.getElementById('tpl-modal').classList.remove('hidden');
  await reloadTemplates();
}
function closeTplModal() { document.getElementById('tpl-modal').classList.add('hidden'); }

async function reloadTemplates() {
  try { templates = await api.get('/api/item_templates'); } catch { return; }
  document.getElementById('tpl-tbody').innerHTML = templates.length ? templates.map(t => `
    <tr class="border-b border-slate-50 last:border-0">
      <td class="p-2">
        <div class="font-medium">${esc(t.name)}</div>
        <div class="text-slate-400 text-[11px]">${t.items.length}개 품목${t.created_by ? ' · ' + esc(t.created_by) : ''}</div>
      </td>
      <td class="p-2 text-right whitespace-nowrap">
        <button onclick="applyTemplate(${t.id})" class="px-2 py-1 border border-slate-200 rounded hover:bg-slate-50">불러오기</button>
        <button onclick="guard(this, () => deleteTemplate(${t.id}))" class="px-2 py-1 text-slate-300 hover:text-red-500">삭제</button>
      </td>
    </tr>`).join('')
    : `<tr><td class="p-6 text-center text-slate-400">저장된 템플릿이 없습니다.</td></tr>`;
}

async function saveTemplate() {
  const name = document.getElementById('tpl-name').value.trim();
  if (!name) return toast('템플릿 이름을 입력하세요.', 'error');
  if (!curItems.length) return toast('저장할 품목이 없습니다.', 'error');
  if (!await tryApi(() => api.post('/api/item_templates', { name, items: curItems }), '템플릿을 저장했습니다.')) return;
  document.getElementById('tpl-name').value = '';
  await reloadTemplates();
}

function applyTemplate(id) {
  const t = templates.find(x => x.id === id);
  if (!t) return;
  // 기존 행을 지우지 않는다. 템플릿은 보태는 것이지 갈아끼우는 게 아니다.
  t.items.forEach(it => curItems.push({ ...it, shipped_qty: 0 }));
  closeTplModal();
  renderTab('items');
  toast(`"${t.name}" 에서 ${t.items.length}개를 넣었습니다. 저장을 눌러야 반영됩니다.`);
}

async function deleteTemplate(id) {
  const t = templates.find(x => x.id === id);
  if (!confirm(`템플릿 "${t?.name || ''}" 을 삭제할까요?`)) return;
  if (!await tryApi(() => api.del(`/api/item_templates/${id}`), '삭제했습니다.')) return;
  await reloadTemplates();
}

/* 저장한 품목 중 카탈로그에 없는 것을 되돌려 등록한다.
 * 서버가 정규화 비교로 중복을 걸러내므로 여기서는 묻기만 한다. */
async function offerCatalogInsert() {
  // server.js 의 normItem 과 같은 규칙이어야 한다. 한쪽만 고치면 화면은 새 품목이라고
  // 묻는데 서버는 중복이라 건너뛰어, 눌러도 아무것도 안 늘어난다.
  const key = (n, s) => `${n}|${s}`.replace(/[\s()[\]{}·・,\-_/]/g, '').toLowerCase();
  const have = new Set(products.map(p => key(p.name, catSpec(p))));
  const seen = new Set();
  const fresh = curItems.filter(it => {
    const n = (it.name || '').trim();
    if (!n || !(it.unit_price > 0)) return false;   // 단가 없는 행은 카탈로그에 쓸모없다
    const k = key(n, it.spec || '');
    if (have.has(k) || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  if (!fresh.length) return;
  if (!confirm(`카탈로그에 없는 품목 ${fresh.length}건이 있습니다.\n` +
               fresh.map(it => `· ${it.name}${it.spec ? ' ['+it.spec+']' : ''} ${(it.unit_price||0).toLocaleString()}원`).join('\n') +
               `\n\n카탈로그에 추가할까요?`)) return;
  const r = await tryApi(() => api.post('/api/products/bulk', fresh.map(it => ({
    name: it.name, spec: it.spec || '', unit: it.unit || 'EA', unit_price: it.unit_price }))));
  if (!r) return;
  products = await api.get('/api/products');
  toast(`카탈로그에 ${r.added}건을 추가했습니다.`);
}

function removeItem(i) {
  const it = curItems[i];
  if ((it?.shipped_qty || 0) > 0 &&
      !confirm(`"${it.name || '이 품목'}" 은 이미 ${qty(it.shipped_qty)} 출고됐습니다.\n삭제는 거부됩니다. 그래도 행을 지울까요?`)) return;
  curItems.splice(i, 1); renderTab('items');
}

async function saveItems() {
  // 서버가 출고분보다 적은 수량·출고 이력 있는 품목 삭제를 400 으로 막는다.
  // 저장을 눌러야 알게 되므로 여기서 먼저 알린다.
  const bad = curItems.filter(it => (it.shipped_qty || 0) > (it.qty || 0));
  if (bad.length) {
    toast(`출고된 수량보다 적게 줄일 수 없습니다.\n${bad.map(it=>`· ${it.name}: 출고 ${qty(it.shipped_qty)}`).join('\n')}`, 'error');
    return;
  }
  const shipped = curItems.filter(it => (it.shipped_qty || 0) > 0);
  if (shipped.length && !confirm(`출고 이력이 있는 품목 ${shipped.length}건이 포함돼 있습니다.\n저장하시겠습니까?`)) return;
  // 과거 이관 주문은 품목 없이 금액만 있다. 빈 채로 저장하면 금액이 0 이 된다.
  const order = orders.find(o => o.id === curId);
  if (!curItems.length && (order?.total || 0) > 0 &&
      !confirm(`이 주문에는 품목 내역이 없지만 금액 ${won(order.total)} 이 기록돼 있습니다.\n` +
               `빈 목록으로 저장하면 금액이 0원이 되고 미수금도 사라집니다.\n\n계속할까요?`)) return;
  if (!await tryApi(() => api.put(`/api/order_items/order/${curId}`, curItems), '저장됐습니다.')) return;
  await offerCatalogInsert();   // curItems 가 selectOrder 로 갈리기 전에 묻는다
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(curId);   // shipped_qty 는 서버가 원장에서 재계산한다
}

async function submitPayment() {

  await api.post('/api/payments', {

async function delPayment(id) {

  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  renderPaymentsTab(document.getElementById('tab-content'));
}

    api.get('/api/quotations'),

async function submitShipItem(itemId, orderId) {
  const n = parseFloat(document.getElementById(`ship-${itemId}`).value);
  if (!(n > 0)) return toast('수량을 입력하세요.', 'error');
  const it = curItems.find(x => x.id === itemId);
  const remain = (it?.qty || 0) - (it?.shipped_qty || 0);
  // 서버도 400 으로 막지만 여기서 먼저 잔여 수량을 보여준다
  if (n > remain) return toast(`잔여 수량 ${qty(remain)} 을 초과했습니다.`, 'error');
  if (!await tryApi(() => api.post('/api/shipments', {
    order_id: orderId, item_id: itemId, qty: n, shipped_at: today() }), '출고됐습니다.')) return;
  [curItems, orders] = await Promise.all([
    api.get(`/api/order_items/order/${orderId}`),
    api.get('/api/quotations'),
  ]);
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(orderId);
}

/* 현장명처럼 문서에 정형으로 찍히는 항목. 메모와 달리 헤더에도 나오므로
 * 저장 뒤 목록·상세를 다시 그린다. */
const DOC_FIELDS = ['site_name','valid_until','delivery_terms','payment_terms'];
async function saveDocFields() {
  const body = {};
  DOC_FIELDS.forEach(f => { body[f] = document.getElementById(`doc-${f}`).value.trim(); });
  if (!await tryApi(() => api.patch(`/api/quotations/${curId}/memo`, body), '저장됐습니다.')) return;
  const order = orders.find(o => o.id === curId);
  if (order) Object.assign(order, body);
  renderList();
  await selectOrder(curId);
  document.querySelector('.detail-tab[data-tab="memo"]')?.click();   // 머물던 탭으로 되돌린다
}

async function saveMemo(type) {
  const val = document.getElementById(`memo-${type}`).value;
  const field = type === 'customer' ? 'memo_customer' : 'memo_internal';
  // 실패해도 성공 알림이 뜨고 로컬 객체만 바뀌던 자리
  if (!await tryApi(() => api.patch(`/api/quotations/${curId}/memo`, { [field]: val }), '저장됐습니다.')) return;
  const order = orders.find(o => o.id === curId);
  if (order) order[field] = val;
}

// ─── 도면 연동 ───────────────────────────────────────────────
/* 도면 연동.
 * 세 겹으로 끊겨 있었다 — 도면 쪽은 APPLY_DRAWING_DATA / CREATE_QUOTATION_FROM_DRAWING
 * 을 보내는데 여기서는 IMPORT_DRAWING_BOM 만 들었고, bom 도 innerText 문자열이라
 * 타입명을 맞춰도 동작하지 않았다. 그리고 ?mode=apply 를 안 붙여 저장 분기를 타지 않았다. */
function openDrawingModal(orderId) {
  const frame = document.getElementById('drawing-frame');
  const iframe = document.getElementById('drawing-iframe');
  const order = orders.find(o => o.id === orderId);
  // mode=apply 여야 도면 쪽이 자동 저장 후 drawingId 와 함께 돌려준다
  const q = new URLSearchParams({ mode: 'apply' });
  if (order?.drawing_id) q.set('load', order.drawing_id);   // 연결된 도면 이어 열기
  iframe.src = `/drawing_app.html?${q}`;
  frame.style.display = 'block';
  window._drawingOrderId = orderId;
}
function closeDrawing() {
  document.getElementById('drawing-frame').style.display = 'none';
  document.getElementById('drawing-iframe').src = '';
}

window.addEventListener('message', async e => {
  // 같은 출처에서 온 메시지만 받는다
  if (e.origin !== location.origin) return;
  const type = e.data?.type;
  if (type !== 'APPLY_DRAWING_DATA' && type !== 'CREATE_QUOTATION_FROM_DRAWING') return;

  const orderId = window._drawingOrderId;
  if (!orderId) return;
  const { bom, specs, drawingId } = e.data;
  const items = (bom?.items || []).map(b => ({
    name: b.name || '', spec: b.spec || '', unit: b.unit || 'EA',
    qty: Number(b.qty) || 0, unit_price: 0, shipped_qty: 0, note: '', tax_free: 0,
  }));
  if (!items.length) {
    closeDrawing();
    return toast('도면에서 가져올 품목이 없습니다. 설계를 먼저 완료하세요.', 'error');
  }

  const summary = `${specs ? `${specs.width}×${specs.length}×${specs.height} · ` : ''}` +
                  `${bom.totalCount || items.length}장 · ${bom.statText || ''}`;
  let replace = true;
  if (curItems.length) {
    replace = confirm(`도면에서 ${items.length}개 품목을 가져옵니다.\n${summary}\n\n` +
                      `확인: 기존 ${curItems.length}개 품목을 대체\n취소: 기존 품목 뒤에 추가`);
  } else if (!confirm(`도면에서 ${items.length}개 품목을 가져옵니다.\n${summary}\n\n계속할까요?`)) {
    return;
  }

  closeDrawing();
  // 도면은 단가를 모른다. 같은 품목을 전에 얼마에 적었는지 서버에 물어 채운다.
  // 근거가 없으면 0 으로 두고 사람이 넣는다.
  const hints = await Promise.all(items.map(it =>
    api.get(`/api/price-hint?name=${encodeURIComponent(it.name)}&spec=${encodeURIComponent(it.spec)}`)
       .catch(() => null)));
  let filled = 0;
  hints.forEach((h, i) => { if (h?.price) { items[i].unit_price = h.price; filled++; } });

  const next = replace ? items : [...curItems, ...items];
  if (!await tryApi(() => api.put(`/api/order_items/order/${orderId}`, next),
                    `${items.length}개 품목을 가져왔습니다.` +
                    (filled ? ` 단가 ${filled}건은 지난 기록에서 채웠습니다.` : ' 단가를 입력하세요.'))) return;
  // 도면 id 를 남겨 나중에 같은 도면을 다시 열 수 있게 한다
  if (drawingId) await tryApi(() => api.patch(`/api/quotations/${orderId}/drawing`, { drawing_id: String(drawingId) }));

  curItems = await api.get(`/api/order_items/order/${orderId}`);
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  await selectOrder(orderId);
  renderTab('items');
});

// ─── 새 견적 생성 (신규) ─────────────────────────────────────
function openNewModal() {
  // 번호는 비워 두면 서버가 매긴다. 화면의 orders 는 다른 사람이 만든 건을
  // 모를 수 있어, 여기서 세면 같은 번호를 두 건에 붙이게 된다.
  document.getElementById('new-no').value = '';
  document.getElementById('compose-no').value = '';
  document.getElementById('new-site').value = '';
  ['new-cust','compose-cust'].forEach(id => customerPicker.reset(id));
  document.getElementById('new-modal').classList.remove('hidden');
  switchNewTab('plain');
}
function closeNewModal() { document.getElementById('new-modal').classList.add('hidden'); }

async function createOrder() {
  const no   = document.getElementById('new-no').value;
  const date = document.getElementById('new-date').value;
  const memo = document.getElementById('new-memo').value;
  const site = document.getElementById('new-site').value;
  // 목록에 없는 상호면 여기서 거래처가 만들어진다 — 화면을 떠날 일이 없다
  if (!customerPicker.value('new-cust').name) return toast('거래처를 입력하세요.', 'error');
  const custId = await customerPicker.resolve('new-cust');
  if (!custId) return;
  customers = await api.get('/api/customers');
  ['new-cust','compose-cust'].forEach(id => customerPicker.setList(id, customers));
  const cust = customers.find(c=>c.id===custId);
  // 번호가 비면 서버가 매긴다. 상태·총액·자사 정보도 서버가 정한다.
  await api.post('/api/quotations', { no, date, customer_id: custId, customer: cust?.name||'', memo, site_name: site });
  closeNewModal();
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  if (orders.length) selectOrder(orders[0].id);
}

// ─── 새 탭 전환 ──────────────────────────────────────────────
function switchNewTab(tab) {
  ['plain','compose'].forEach(t => {
    document.getElementById(`new-tab-${t}`).className = 'px-4 py-2 text-sm font-medium border-b-2 -mb-px ' + (t===tab ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500');

  });
  if (tab === 'compose') loadComposeQuotes();
}

  const allItems = await Promise.all(draftOrders.map(o => api.get(`/api/order_items/order/${o.id}`)));
  const custName = o => customers.find(c=>c.id===o.customer_id)?.name || o.customer || '—';

  el.innerHTML = draftOrders.map((o, idx) => {
    const items = allItems[idx];
    if (!items.length) return '';
    return `<div class="border-b border-slate-100 last:border-0">
      <div class="px-3 py-2 bg-slate-50 text-xs font-medium text-slate-700">${esc(custName(o))} <span class="text-slate-400 font-normal">${esc(o.no||'#'+o.id)}</span></div>

          <span class="text-xs flex-1">${esc(it.name)} <span class="text-slate-400">${esc(it.spec||'')}</span></span>
          <span class="text-xs text-slate-500 shrink-0">${qty(it.qty)}${esc(it.unit)} · ${(it.unit_price||0).toLocaleString()}원</span>

      </div>
    </div>`;
  }).join('') || '<div class="p-3 text-sm text-slate-400 text-center">품목이 없습니다.</div>';

  composeExtraItems = [];
  renderComposeExtraItems();
}

  el.innerHTML = `<div class="border border-slate-200 rounded-lg overflow-hidden"><table class="w-full text-xs">
    <thead class="bg-slate-50"><tr>
      <th class="p-2 text-left">품목명</th><th class="p-2 text-left">규격</th>
      <th class="p-2 text-right w-14">수량</th><th class="p-2 text-left w-12">단위</th>
      <th class="p-2 text-right w-24">단가</th><th class="p-2 w-6"></th>
    </tr></thead>
    <tbody>${composeExtraItems.map((it,i)=>`<tr class="border-t border-slate-50">
      <td class="p-1"><input value="${esc(it.name||'')}" class="w-full border border-slate-200 rounded px-2 py-1" onchange="composeExtraItems[${i}].name=this.value"></td>
      <td class="p-1"><input value="${esc(it.spec||'')}" class="w-full border border-slate-200 rounded px-2 py-1" onchange="composeExtraItems[${i}].spec=this.value"></td>
      <td class="p-1"><input type="number" value="${it.qty||0}" class="w-full border border-slate-200 rounded px-2 py-1 text-right" onchange="composeExtraItems[${i}].qty=parseFloat(this.value)||0"></td>
      <td class="p-1"><input value="${esc(it.unit||'EA')}" class="w-full border border-slate-200 rounded px-2 py-1" onchange="composeExtraItems[${i}].unit=this.value"></td>
      <td class="p-1"><input type="number" value="${it.unit_price||0}" class="w-full border border-slate-200 rounded px-2 py-1 text-right" onchange="composeExtraItems[${i}].unit_price=parseInt(this.value)||0"></td>
      <td class="p-1 text-center"><button onclick="composeExtraItems.splice(${i},1);renderComposeExtraItems()" class="text-slate-300 hover:text-red-400">×</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function addComposeItem() {
  composeExtraItems.push({ name:'', spec:'', unit:'EA', qty:1, unit_price:0 });
  renderComposeExtraItems();
}

async function createFromQuotations() {
  if (!customerPicker.value('compose-cust').name) return toast('거래처를 입력하세요.', 'error');
  const custId = await customerPicker.resolve('compose-cust');
  if (!custId) return;
  customers = await api.get('/api/customers');
  ['new-cust','compose-cust'].forEach(id => customerPicker.setList(id, customers));

  const checkedItems = Array.from(document.querySelectorAll('.compose-item-check:checked'));
  const quoteMap = {};
  checkedItems.forEach(el => {
    const qid = parseInt(el.dataset.quote);
    if (!quoteMap[qid]) quoteMap[qid] = [];
    quoteMap[qid].push(parseInt(el.dataset.item));
  });
  const items_from = Object.entries(quoteMap).map(([qid,ids]) => ({ quotation_id:parseInt(qid), selected_item_ids:ids }));
  const extraValid = composeExtraItems.filter(it=>it.name);

  if (!items_from.length && !extraValid.length) return alert('견적서에서 품목을 선택하거나 추가 품목을 입력하세요.');

  const cust = customers.find(c=>c.id===custId);
  // api.post 는 이미 파싱된 JSON 을 돌려준다. 여기서 .json() 을 한 번 더 부르면
  // TypeError 가 나서 모달이 닫히지도, 목록이 갱신되지도 않았다.
  let r;
  try {
    r = await api.post('/api/quotations/from-quotations', {
      customer_id: custId, customer: cust?.name||'',
      no: document.getElementById('compose-no').value,
      date: document.getElementById('compose-date').value,
      items_from, additional_items: extraValid,
    });
  } catch (e) { return toast(e.message, 'error'); }

  closeNewModal();
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  if (r?.id) selectOrder(r.id);
}

// ─── 출고 묶음 ───────────────────────────────────────────────
let shipBatchItems = {}; // { orderId: [items] }

async function openShipBatchModal() {
  const shippable = orders.filter(o => ['ordered','partial'].includes(o.order_status));
  if (!shippable.length) { alert('출고 가능한 주문서(주문/부분출고)가 없습니다.'); return; }

  shipBatchItems = {};
  await Promise.all(shippable.map(async o => {
    shipBatchItems[o.id] = await api.get(`/api/order_items/order/${o.id}`);
  }));

  const custName = o => customers.find(c=>c.id===o.customer_id)?.name || o.customer || '—';

  document.getElementById('ship-batch-content').innerHTML = shippable.map(o => {
    const unshipped = (shipBatchItems[o.id]||[]).filter(it => (it.qty||0) > (it.shipped_qty||0));
    if (!unshipped.length) return '';
    return `<div class="mb-3 border border-slate-200 rounded-lg overflow-hidden">
      <div class="bg-slate-50 px-3 py-2 flex items-center gap-2">
        <input type="checkbox" id="sbo-${o.id}" class="sbo-check" data-order="${o.id}" onchange="toggleSBOrder(${o.id})">
        <label for="sbo-${o.id}" class="text-sm font-medium cursor-pointer">${esc(custName(o))}</label>
        <span class="text-xs text-slate-400">${esc(o.no||'#'+o.id)}</span>
      </div>
      <div id="sbo-items-${o.id}" class="hidden">
        <table class="w-full text-xs"><thead class="bg-slate-50/50"><tr>
          <th class="p-2 text-left font-medium text-slate-500">품목</th>
          <th class="p-2 text-right font-medium text-slate-500 w-20">잔여</th>
          <th class="p-2 text-right font-medium text-slate-500 w-24">이번 출고</th>
        </tr></thead><tbody>${unshipped.map(it=>`
          <tr class="border-t border-slate-100">
            <td class="p-2">${esc(it.name)} <span class="text-slate-400">${esc(it.spec||'')}</span></td>
            <td class="p-2 text-right text-orange-600">${qty((it.qty||0)-(it.shipped_qty||0))} ${esc(it.unit)}</td>
            <td class="p-2"><input type="number" id="sbq-${it.id}" min="0" max="${qty((it.qty||0)-(it.shipped_qty||0))}" step="0.01" value="0" data-order="${o.id}" data-item="${it.id}" class="w-full border border-slate-200 rounded px-2 py-1 text-right text-xs"></td>
          </tr>`).join('')}</tbody></table>
      </div>
    </div>`;
  }).join('') || '<div class="p-4 text-sm text-slate-400 text-center">미출고 품목이 없습니다.</div>';

  document.getElementById('sb-date').value = today();
  document.getElementById('sb-note').value = '';
  document.getElementById('ship-batch-modal').classList.remove('hidden');
}

function toggleSBOrder(orderId) {
  const checked = document.getElementById(`sbo-${orderId}`).checked;
  document.getElementById(`sbo-items-${orderId}`).classList.toggle('hidden', !checked);
}

function closeShipBatchModal() { document.getElementById('ship-batch-modal').classList.add('hidden'); }

async function submitShipBatch() {
  const checkedOrders = Array.from(document.querySelectorAll('.sbo-check:checked')).map(el => parseInt(el.dataset.order));
  if (!checkedOrders.length) { alert('주문서를 선택하세요.'); return; }

  const items = [];
  const over  = [];
  for (const orderId of checkedOrders) {
    for (const it of (shipBatchItems[orderId]||[])) {
      const remain = (it.qty||0) - (it.shipped_qty||0);
      if (remain <= 0) continue;
      const n = parseFloat(document.getElementById(`sbq-${it.id}`)?.value || 0);
      if (!(n > 0)) continue;
      // 서버도 막지만(400) 묶음은 통째로 실패해 어느 품목이 문제인지 알 수 없다
      if (n > remain) { over.push(`· ${it.name}: 잔여 ${qty(remain)} < 입력 ${qty(n)}`); continue; }
      items.push({ order_id: orderId, item_id: it.id, qty: n });
    }
  }
  if (over.length) { toast(`잔여 수량을 초과했습니다.\n${over.join('\n')}`, 'error'); return; }
  if (!items.length) { toast('출고 수량을 입력하세요.', 'error'); return; }

  const lines = items.map(x => {
    const it = (shipBatchItems[x.order_id]||[]).find(i => i.id === x.item_id);
    const o  = orders.find(q => q.id === x.order_id);
    return `· ${o?.no || '#'+x.order_id} ${it?.name || ''} ${qty(x.qty)}${it?.unit || ''}`;
  });
  if (!confirm(`${items.length}개 품목을 출고 처리합니다.\n\n${lines.join('\n')}\n\n계속할까요?`)) return;

  if (!await tryApi(() => api.post('/api/shipment-batches', {
    items, shipped_at: document.getElementById('sb-date').value, note: document.getElementById('sb-note').value,
  }), '출고 처리됐습니다.')) return;

  closeShipBatchModal();
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  if (curId) await selectOrder(curId);
}

// ─── 완료 묶음 ───────────────────────────────────────────────
async function openCompletionBatchModal() {
  const completable = orders.filter(o => o.order_status === 'shipped');
  if (!completable.length) { alert('완료 처리 가능한 주문서가 없습니다.\n(출고 상태 주문서가 있어야 합니다.)'); return; }

  const custName = o => customers.find(c=>c.id===o.customer_id)?.name || o.customer || '—';

  document.getElementById('completion-batch-content').innerHTML = `
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden mb-3">
      <table class="w-full text-xs"><thead class="bg-slate-50"><tr>
        <th class="p-2 w-8"></th>
        <th class="p-2 text-left font-medium text-slate-500">고객</th>
        <th class="p-2 text-left font-medium text-slate-500">번호</th>
        <th class="p-2 text-right font-medium text-slate-500">금액</th>
        <th class="p-2 text-right font-medium text-slate-500">일자</th>
      </tr></thead><tbody>${completable.map(o=>`
        <tr class="border-t border-slate-50">
          <td class="p-2 text-center"><input type="checkbox" class="cbo-check" value="${o.id}"></td>
          <td class="p-2 font-medium">${esc(custName(o))}</td>
          <td class="p-2 text-slate-500">${esc(o.no||'#'+o.id)}</td>
          <td class="p-2 text-right">${(o.total||0).toLocaleString()}원</td>
          <td class="p-2 text-right">${esc(o.date||'')}</td>
        </tr>`).join('')}</tbody></table>
    </div>`;

  document.getElementById('cb-date').value = today();
  document.getElementById('cb-note').value = '';
  document.getElementById('completion-batch-modal').classList.remove('hidden');
}

function closeCompletionBatchModal() { document.getElementById('completion-batch-modal').classList.add('hidden'); }

async function submitCompletionBatch() {
  const orderIds = Array.from(document.querySelectorAll('.cbo-check:checked')).map(el => parseInt(el.value));
  if (!orderIds.length) { toast('주문서를 선택하세요.', 'error'); return; }

  // 완료되면 미수금 현황에서 빠진다 — 남은 금액을 먼저 보여준다
  const withUnpaid = orderIds
    .map(id => orders.find(o => o.id === id))
    .filter(o => o && (o.total||0) > (o.total_paid||0));
  if (withUnpaid.length) {
    const sum = withUnpaid.reduce((s,o) => s + ((o.total||0)-(o.total_paid||0)), 0);
    const list = withUnpaid.map(o => `· ${o.no||'#'+o.id} ${won((o.total||0)-(o.total_paid||0))}`).join('\n');
    if (!confirm(`미수금이 남은 주문 ${withUnpaid.length}건 (합계 ${won(sum)})\n\n${list}\n\n완료 처리하시겠습니까?`)) return;
  } else if (!confirm(`${orderIds.length}건을 완료 처리할까요?`)) return;

  if (!await tryApi(() => api.post('/api/completion-batches', {
    order_ids: orderIds, completed_at: document.getElementById('cb-date').value, note: document.getElementById('cb-note').value,
  }), '완료 처리됐습니다.')) return;

  closeCompletionBatchModal();
  orders = await api.get('/api/quotations');
  orders.sort((a,b) => b.id - a.id);
  renderList();
  if (curId && orderIds.includes(curId)) await selectOrder(curId);
}

init();
</script>
