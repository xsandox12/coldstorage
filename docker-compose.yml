services:
  coldstorage:
    build: .
    container_name: coldstorage
    # 터널(cloudflared)만 접근하므로 LAN 에 노출할 이유가 없다
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # 최초 관리자 계정 — users 테이블이 비어 있을 때만 쓰인다.
      # 실제 값은 서버의 ~/coldstorage/.env 에 두고 절대 커밋하지 않는다(.env.example 참고).
      ADMIN_USER:     ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME:     ${ADMIN_NAME:-관리자}
      # 공용 비밀번호 시절 값. 둘 다 비면 최초 관리자가 만들어지지 않아
      # 아무도 로그인할 수 없으므로 기본값을 남겨 둔다.
      # 배포 직후 /account.html 에서 바꾸면 이 값은 더 이상 쓰이지 않는다
      # (seedAdmin 은 users 가 비어 있을 때만 동작한다).
      APP_PASSWORD:   ${APP_PASSWORD:-0000}
      # HTTPS 터널 뒤이므로 쿠키에 Secure 를 붙인다
      COOKIE_SECURE:  ${COOKIE_SECURE:-1}
    volumes:
      - coldstorage-data:/app/data
    networks:
      - default
      # cloudflared 가 http://coldstorage:9000 으로 도달하려면 필요
      - main_default
    restart: unless-stopped

volumes:
  coldstorage-data:

networks:
  main_default:
    external: true
