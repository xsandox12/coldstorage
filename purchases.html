<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구매 — ColdStorage</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/common.js"></script>
<script src="/api.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { font-family: 'Pretendard', sans-serif; }
  .nav-link { display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;color:#94a3b8;font-size:13px;font-weight:500;transition:all .15s; }
  .nav-link:hover { background:#334155;color:#e2e8f0; }
  .nav-link.active { background:#1d4ed8;color:#fff; }
  .status-badge { display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600; }
  .s-draft    { background:#dbeafe;color:#1d4ed8; }
  .s-ordered  { background:#ffedd5;color:#c2410c; }
  .s-partial  { background:#fef9c3;color:#854d0e; }
  .s-shipped  { background:#ede9fe;color:#6d28d9; }
  .s-done     { background:#dcfce7;color:#15803d; }
  .s-cancelled { background:#fee2e2;color:#dc2626; }
  .row-sel    { background:#eff6ff!important; }
  ::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .item-row input { border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:12px;width:100%; }
  .item-row input:focus { outline:none;border-color:#3b82f6; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

<aside class="w-52 bg-slate-800 flex flex-col shrink-0">
  <div class="p-4 border-b border-slate-700">
    <div class="text-white font-bold text-sm">❄️ ColdStorage</div>
    <div class="text-slate-400 text-xs mt-0.5">한남냉동테크(주)</div>
  </div>
  <nav class="flex-1 p-3 flex flex-col gap-1 overflow-y-auto">
    <a href="/" class="nav-link">🏠 대시보드</a>
    <a href="/orders.html" class="nav-link">📋 판매</a>
    <a href="/purchases.html" class="nav-link active">🛒 구매</a>
    <a href="/customers.html" class="nav-link">👤 고객</a>
    <a href="/as.html" class="nav-link">🔧 A/S</a>
    <a href="/payments.html" class="nav-link">💰 입금</a>
    <a href="/products.html" class="nav-link">📦 상품</a>
    <div class="mt-auto pt-3 border-t border-slate-700">
      <a href="/drawing_app.html" target="_blank" class="nav-link">✏️ 도면 설계 ↗</a>
      <a href="/logout" class="nav-link">🚪 로그아웃</a>
    </div>
  </nav>
</aside>

<div class="flex-1 flex overflow-hidden">
  <!-- 목록 -->
  <div class="w-[420px] shrink-0 flex flex-col border-r border-slate-200 bg-white">
    <div class="p-4 border-b border-slate-100">
      <div class="flex items-center justify-between mb-3">
        <h1 class="font-bold text-base">구매 / 발주</h1>
        <button onclick="openNewModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-blue-700">+ 새 구매</button>
      </div>
      <div class="flex gap-1 flex-wrap" id="filter-tabs">
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-white" data-s="all">전체</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="draft">작성중</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="ordered">발주</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="partial">부분입고</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="received">입고완료</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="done">정산완료</button>
        <button class="tab-btn px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" data-s="cancelled">취소</button>
      </div>
      <input id="search" type="text" placeholder="공급업체, 구매번호, 품목 검색…" autocomplete="off"
             class="w-full mt-2 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      <div class="flex items-center gap-1 mt-2">
        <input id="from" type="date" class="flex-1 min-w-0 border border-slate-200 rounded px-2 py-1 text-xs">
        <span class="text-xs text-slate-400">~</span>
        <input id="to" type="date" class="flex-1 min-w-0 border border-slate-200 rounded px-2 py-1 text-xs">
        <button onclick="clearFilters()" class="text-xs px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 text-slate-500">초기화</button>
        <button onclick="exportPurchases()" title="현재 조건으로 엑셀(CSV) 내보내기"
                class="text-xs px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 text-slate-500">CSV</button>
      </div>
    </div>
    <div id="purchase-list" class="flex-1 overflow-y-auto divide-y divide-slate-50"></div>
  </div>

  <!-- 상세 패널 -->
  <div class="flex-1 flex flex-col overflow-hidden bg-slate-50">
    <div class="flex-1 flex items-center justify-center text-slate-400 text-sm" id="empty-state">
      ← 왼쪽에서 구매를 선택하세요
    </div>
    <div class="flex-1 flex flex-col overflow-hidden hidden" id="detail-content"></div>
  </div>
</div>

<!-- 새 구매 모달 -->
<div id="new-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[480px] shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-base">새 구매 작성</h2>
      <button onclick="closeNewModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <div class="flex flex-col gap-3">
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">공급업체 선택 (선택)</label>
        <select id="new-vendor-sel" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
          <option value="">-- 거래처에서 선택 --</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">공급업체명 *</label>
        <input id="new-vendor" type="text" placeholder="공급업체명 직접 입력" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">구매 번호</label>
          <input id="new-no" type="text" placeholder="자동 생성" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">날짜</label>
          <input id="new-date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
        </div>
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">메모 (선택)</label>
        <input id="new-memo" type="text" placeholder="품목 요약, 현장명 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeNewModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">취소</button>
      <button onclick="guard(this, createPurchase)" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">생성</button>
    </div>
  </div>
</div>

<!-- ─── 발주 취소 모달 ─────────────────────────────────────── -->
<div id="cancel-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-[420px] shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-base text-red-600">발주 취소</h2>
      <button onclick="closeCancelModal()" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
    </div>
    <p class="text-sm text-slate-600 mb-3">이 발주건을 취소 상태로 변경합니다.</p>
    <div>
      <label class="text-xs font-medium text-slate-500 mb-1 block">취소 사유</label>
      <input id="cancel-reason" type="text" placeholder="공급업체 사정, 발주 오류 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-400">
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeCancelModal()" class="px-4 py-2 text-sm border border-slate-200 rounded-lg hover:bg-slate-50">돌아가기</button>
      <button onclick="guard(this, submitCancel)" class="px-4 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700">취소 처리</button>
    </div>
  </div>
</div>

<script>
const STATUS_LABEL = { draft:'작성중', ordered:'발주', partial:'부분입고', received:'입고완료', done:'정산완료', cancelled:'취소' };
const STATUS_CLS   = { draft:'s-draft', ordered:'s-ordered', partial:'s-partial', received:'s-shipped', done:'s-done', cancelled:'s-cancelled' };
const STATUS_FLOW  = { draft:'ordered', ordered:'received', partial:'received', received:'done' };
const STATUS_BTN   = { draft:'발주 확정', ordered:'입고 처리', partial:'입고 처리', received:'정산 완료' };

let purchases = [], customers = [], curFilter = 'all', curId = null, curItems = [], curPayments = [];

async function init() {
  [purchases, customers] = await Promise.all([
    api.get('/api/purchases'),
    api.get('/api/customers'),
  ]);
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  const sel = document.getElementById('new-vendor-sel');
  customers.forEach(c => { const o = document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o); });
  sel.onchange = () => {
    const c = customers.find(x=>x.id===sel.value);
    if (c) document.getElementById('new-vendor').value = c.name;
  };
  document.getElementById('new-date').value = today();
}

let shownCount = PAGE_SIZE;
const val = id => document.getElementById(id)?.value.trim() || '';

function filtered() {
  const q = val('search'), from = val('from'), to = val('to');
  return purchases.filter(p =>
    (curFilter === 'all' || p.purchase_status === curFilter) &&
    inRange(p.date, from, to) &&
    matches(q, p.no, p.vendor, p.items, p.memo, p.created_by));
}

function applyFilters() { shownCount = PAGE_SIZE; renderList(); }
function showMore()     { shownCount += PAGE_SIZE; renderList(); }
function exportPurchases() {
  exportCsv('purchases', { q: val('search'), from: val('from'), to: val('to'),
                           status: curFilter === 'all' ? '' : curFilter });
}

function renderList() {
  const list = document.getElementById('purchase-list');
  const rows = filtered();
  list.innerHTML = pagedHtml(rows, shownCount, p => {
    const unpaid = (p.total||0) - (p.total_paid||0);
    return `<div class="p-3 cursor-pointer hover:bg-slate-50 ${curId===p.id?'row-sel':''}" onclick="selectPurchase(${p.id})">
      <div class="flex items-center justify-between mb-1">
        <span class="font-medium text-sm truncate max-w-[180px]">${esc(p.vendor||'—')}</span>
        <span class="status-badge ${STATUS_CLS[p.purchase_status]||'s-draft'}">${STATUS_LABEL[p.purchase_status]||p.purchase_status}</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">${esc(p.no||'#'+p.id)} · ${esc(p.date||'')}</span>
        <div class="text-right">
          <div class="text-xs font-semibold text-slate-700">${(p.total||0).toLocaleString()}원</div>
          ${unpaid>0 ? `<div class="text-xs text-red-500">미결 ${unpaid.toLocaleString()}원</div>` : ''}
        </div>
      </div>
      ${p.items ? `<div class="text-xs text-slate-400 mt-1 truncate">${esc(p.items)}</div>` : ''}
    </div>`;
  }, 'showMore', '조건에 맞는 구매 건이 없습니다.');
}

document.getElementById('filter-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  curFilter = btn.dataset.s;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = 'tab-btn px-3 py-1 rounded-full text-xs font-medium ' + (b===btn ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600');
  });
  applyFilters();
});

document.getElementById('search').addEventListener('input', debounce(applyFilters, 180));
for (const id of ['from','to']) document.getElementById(id).addEventListener('change', applyFilters);

async function selectPurchase(id) {
  curId = id;
  renderList();
  const purchase = purchases.find(p => p.id === id);
  if (!purchase) return;

  [curItems, curPayments] = await Promise.all([
    api.get(`/api/purchase_items/purchase/${id}`),
    api.get(`/api/purchase_payments/purchase/${id}`),
  ]);

  const unpaid = (purchase.total||0) - (purchase.total_paid||0);
  const nextStatus  = STATUS_FLOW[purchase.purchase_status];
  const isCancelled = purchase.purchase_status === 'cancelled';

  document.getElementById('empty-state').classList.add('hidden');
  const dc = document.getElementById('detail-content');
  dc.classList.remove('hidden');
  dc.innerHTML = `
    <div class="p-5 border-b border-slate-200 bg-white">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="font-bold text-base">${esc(purchase.vendor||'—')}</span>
            <span class="status-badge ${STATUS_CLS[purchase.purchase_status]||'s-draft'}">${STATUS_LABEL[purchase.purchase_status]||purchase.purchase_status}</span>
          </div>
          <div class="text-xs text-slate-400">${esc(purchase.no||'#'+purchase.id)} · ${esc(purchase.date||'')}</div>
        </div>
        <div class="flex items-center gap-2">
          ${isCancelled
            ? `<button onclick="guard(this, () => uncancelPurchase(${purchase.id}))" class="text-xs px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50">취소 해제</button>`
            : `${nextStatus ? `<button onclick="guard(this, () => advanceStatus(${purchase.id},'${nextStatus}'))" class="text-xs px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700">${STATUS_BTN[purchase.purchase_status]}</button>` : ''}
               ${purchase.purchase_status !== 'done' ? `<button onclick="openCancelModal(${purchase.id})" class="text-xs px-3 py-1.5 border border-red-200 text-red-600 rounded-lg hover:bg-red-50">거래 취소</button>` : ''}`}
          <button onclick="guard(this, () => deletePurchase(${purchase.id}))" class="text-xs px-2 py-1.5 text-slate-400 hover:text-red-600" title="발주 삭제">🗑</button>
        </div>
      </div>
      ${isCancelled && purchase.cancelled_reason ? `<div class="text-xs text-red-500 mt-1">취소 사유: ${esc(purchase.cancelled_reason)}${purchase.cancelled_at ? ` (${esc(purchase.cancelled_at)})` : ''}</div>` : ''}
      <!-- 공급가는 total/1.1 로 역산하던 값이라 실제와 달랐다.
           이제 서버가 품목에서 계산한 supply_amount/vat_amount 를 그대로 쓴다. -->
      <div class="grid grid-cols-5 gap-2 mt-4">
        <div class="bg-slate-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">공급가액</div>
          <div class="text-sm font-semibold">${num(purchase.supply_amount)}</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">부가세${purchase.exempt_amount ? ` <span class="text-slate-300">·면세 ${num(purchase.exempt_amount)}</span>` : ''}</div>
          <div class="text-sm font-semibold">${num(purchase.vat_amount)}</div>
        </div>
        <div class="bg-slate-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">합계</div>
          <div class="text-sm font-semibold">${num(purchase.total)}</div>
        </div>
        <div class="bg-green-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">결제</div>
          <div class="text-sm font-semibold text-green-700">${(purchase.total_paid||0).toLocaleString()}</div>
        </div>
        <div class="bg-${unpaid>0?'red':'slate'}-50 rounded-lg p-2 text-center">
          <div class="text-xs text-slate-400">미지급</div>
          <div class="text-sm font-semibold text-${unpaid>0?'red-600':'slate-400'}">${unpaid.toLocaleString()}</div>
        </div>
      </div>
    </div>

    <div class="border-b border-slate-200 bg-white px-5 flex gap-4" id="detail-tabs">
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600" data-tab="items">품목</button>
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-transparent text-slate-500" data-tab="payments">결제</button>
      <button class="detail-tab py-2 text-sm font-medium border-b-2 border-transparent text-slate-500" data-tab="receipts">입고</button>
    </div>

    <div class="flex-1 overflow-y-auto p-5" id="tab-content"></div>
  `;

  renderTab('items');
  document.getElementById('detail-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.detail-tab');
    if (!btn) return;
    document.querySelectorAll('.detail-tab').forEach(b => {
      b.className = 'detail-tab py-2 text-sm font-medium border-b-2 ' + (b===btn ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500');
    });
    renderTab(btn.dataset.tab);
  });
}

function renderTab(tab) {
  const tc = document.getElementById('tab-content');
  if (tab === 'items') renderItemsTab(tc);
  else if (tab === 'payments') renderPaymentsTab(tc);
  else if (tab === 'receipts') renderReceiptsTab(tc);
}

function renderItemsTab(tc) {
  const purchase = purchases.find(p => p.id === curId);
  const isDone = purchase?.purchase_status === 'done';
  tc.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <span class="text-sm font-semibold">품목 목록</span>
        <label class="text-xs text-slate-500 flex items-center gap-1">
          단가 기준
          <select ${isDone ? 'disabled' : ''} onchange="changeTaxMode(this)"
                  class="text-xs border border-slate-200 rounded px-2 py-1 bg-white disabled:bg-slate-50">
            <option value="EXCLUSIVE"${purchase?.vat_mode !== 'INCLUSIVE' ? ' selected' : ''}>부가세 별도</option>
            <option value="INCLUSIVE"${purchase?.vat_mode === 'INCLUSIVE' ? ' selected' : ''}>부가세 포함</option>
          </select>
        </label>
      </div>
      ${!isDone ? `<div class="flex gap-2">
        <button onclick="addItemRow()" class="text-xs px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-50">+ 행 추가</button>
        <button onclick="guard(this, saveItems)" class="text-xs px-3 py-1 bg-blue-600 text-white rounded-lg hover:bg-blue-700">저장</button>
      </div>` : ''}
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500">
          <tr>
            <th class="p-2 text-left font-medium">품목명</th>
            <th class="p-2 text-left font-medium">규격</th>
            <th class="p-2 text-right font-medium w-16">수량</th>
            <th class="p-2 text-left font-medium w-14">단위</th>
            <th class="p-2 text-right font-medium w-24">단가</th>
            <th class="p-2 text-right font-medium w-24">금액</th>
            <th class="p-2 text-center font-medium w-12">면세</th>
            <th class="p-2 text-right font-medium w-16">입고</th>
            ${!isDone ? '<th class="p-2 w-8"></th>' : ''}
          </tr>
        </thead>
        <tbody id="items-tbody">
          ${curItems.map((it,i) => itemRow(it, i, isDone)).join('')}
        </tbody>
      </table>
      <div class="border-t border-slate-100 bg-slate-50 p-3" id="items-summary">${itemsSummary(purchase)}</div>
    </div>
  `;
}

/* 부가세는 문서 단위로 한 번만 계산한다 — 행별 세액을 합산하면 1원씩 어긋난다. */
function calcTotals(p) {
  const rate = Number(p?.vat_rate);
  const vatRate = Number.isFinite(rate) && rate >= 0 ? rate : 0.1;
  const inclusive = p?.vat_mode === 'INCLUSIVE';
  let taxable = 0, exempt = 0;
  for (const it of curItems) {
    const amt = Math.round((Number(it.qty)||0) * (Number(it.unit_price)||0));
    if (it.tax_free) exempt += amt; else taxable += amt;
  }
  let supply, vat;
  if (inclusive) { supply = Math.round(taxable / (1 + vatRate)); vat = taxable - supply; }
  else           { supply = taxable; vat = Math.floor(supply * vatRate); }
  return { supply, vat, exempt, total: inclusive ? taxable + exempt : supply + exempt + vat, vatRate };
}

function itemsSummary(p) {
  const t = calcTotals(p);
  const dirty = (p?.total || 0) !== t.total;
  return `
    <div class="flex justify-end gap-6 text-xs">
      <div><span class="text-slate-400">공급가액</span> <span class="font-semibold ml-1">${num(t.supply)}원</span></div>
      ${t.exempt ? `<div><span class="text-slate-400">면세</span> <span class="font-semibold ml-1">${num(t.exempt)}원</span></div>` : ''}
      <div><span class="text-slate-400">부가세 (${Math.round(t.vatRate*1000)/10}%)</span> <span class="font-semibold ml-1">${num(t.vat)}원</span></div>
      <div><span class="text-slate-400">합계</span> <span class="font-bold text-sm ml-1">${num(t.total)}원</span></div>
    </div>
    ${dirty ? '<div class="text-right text-xs text-orange-500 mt-1">저장하지 않은 변경이 있습니다.</div>' : ''}`;
}

async function changeTaxMode(sel) {
  const prev = purchases.find(p => p.id === curId)?.vat_mode || 'EXCLUSIVE';
  sel.disabled = true;
  const ok = await tryApi(() => api.patch(`/api/purchases/${curId}/tax`, { vat_mode: sel.value }),
                          '과세 방식을 변경했습니다.');
  sel.disabled = false;
  if (!ok) { sel.value = prev; return; }
  purchases = await api.get('/api/purchases');
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  await selectPurchase(curId);
}

function itemRow(it, i, isDone) {
  const amt = (it.qty||0)*(it.unit_price||0);
  if (isDone) return `<tr class="border-t border-slate-50">
    <td class="p-2">${esc(it.name)}</td><td class="p-2 text-slate-500">${esc(it.spec||'')}</td>
    <td class="p-2 text-right">${qty(it.qty)}</td><td class="p-2">${esc(it.unit)}</td>
    <td class="p-2 text-right">${(it.unit_price||0).toLocaleString()}</td>
    <td class="p-2 text-right">${amt.toLocaleString()}</td>
    <td class="p-2 text-center">${it.tax_free ? '면세' : ''}</td>
    <td class="p-2 text-right text-blue-600">${qty(it.received_qty)}</td>
  </tr>`;
  return `<tr class="item-row border-t border-slate-50" data-idx="${i}">
    <td class="p-1"><input value="${esc(it.name||'')}" placeholder="품목명" onchange="curItems[${i}].name=this.value"></td>
    <td class="p-1"><input value="${esc(it.spec||'')}" placeholder="규격" onchange="curItems[${i}].spec=this.value"></td>
    <td class="p-1"><input type="number" value="${it.qty||0}" min="0" step="0.01" style="width:60px" onchange="curItems[${i}].qty=parseFloat(this.value)||0;updateAmounts()"></td>
    <td class="p-1"><input value="${esc(it.unit||'EA')}" style="width:50px" onchange="curItems[${i}].unit=this.value"></td>
    <td class="p-1"><input type="number" value="${it.unit_price||0}" min="0" style="width:90px;text-align:right" onchange="curItems[${i}].unit_price=parseInt(this.value)||0;updateAmounts()"></td>
    <td class="p-2 text-right item-amt">${amt.toLocaleString()}</td>
    <td class="p-2 text-center"><input type="checkbox"${it.tax_free ? ' checked' : ''}
        title="면세 품목 — 과세표준에서 제외됩니다"
        onchange="curItems[${i}].tax_free = this.checked ? 1 : 0; updateAmounts()"></td>
    <td class="p-2 text-right text-blue-600">${qty(it.received_qty)}</td>
    <td class="p-1 text-center"><button onclick="removeItem(${i})" class="text-slate-300 hover:text-red-400 text-base">×</button></td>
  </tr>`;
}

function updateAmounts() {
  document.querySelectorAll('.item-row').forEach((tr,i) => {
    const it = curItems[i];
    if (it) tr.querySelector('.item-amt').textContent = Math.round((it.qty||0)*(it.unit_price||0)).toLocaleString();
  });
  const box = document.getElementById('items-summary');
  if (box) box.innerHTML = itemsSummary(purchases.find(p => p.id === curId));
}
function addItemRow() {
  curItems.push({ name:'', spec:'', unit:'EA', qty:0, unit_price:0, received_qty:0, note:'', tax_free:0 });
  renderTab('items');
}
function removeItem(i) {
  const it = curItems[i];
  if ((it?.received_qty || 0) > 0 &&
      !confirm(`"${it.name || '이 품목'}" 은 이미 ${qty(it.received_qty)} 입고됐습니다.\n삭제는 거부됩니다. 그래도 행을 지울까요?`)) return;
  curItems.splice(i, 1); renderTab('items');
}

async function saveItems() {
  // 서버가 입고분보다 적은 수량·입고 이력 있는 품목 삭제를 400 으로 막는다.
  const bad = curItems.filter(it => (it.received_qty || 0) > (it.qty || 0));
  if (bad.length) {
    toast(`입고된 수량보다 적게 줄일 수 없습니다.\n${bad.map(it=>`· ${it.name}: 입고 ${qty(it.received_qty)}`).join('\n')}`, 'error');
    return;
  }
  const received = curItems.filter(it => (it.received_qty || 0) > 0);
  if (received.length && !confirm(`입고 이력이 있는 품목 ${received.length}건이 포함돼 있습니다.\n저장하시겠습니까?`)) return;
  const purchase = purchases.find(p => p.id === curId);
  if (!curItems.length && (purchase?.total || 0) > 0 &&
      !confirm(`이 구매 건에는 품목 내역이 없지만 금액 ${won(purchase.total)} 이 기록돼 있습니다.\n` +
               `빈 목록으로 저장하면 금액이 0원이 되고 미지급금도 사라집니다.\n\n계속할까요?`)) return;
  if (!await tryApi(() => api.put(`/api/purchase_items/purchase/${curId}`, curItems), '저장됐습니다.')) return;
  purchases = await api.get('/api/purchases');
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  await selectPurchase(curId);   // received_qty 는 서버가 원장에서 재계산한다
}

function renderPaymentsTab(tc) {
  tc.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-semibold">결제 내역</span>
      <button onclick="showPayForm()" class="text-xs px-3 py-1 bg-green-600 text-white rounded-lg hover:bg-green-700">+ 결제 등록</button>
    </div>
    <div id="pay-form" class="hidden bg-white rounded-xl border border-slate-200 p-4 mb-3">
      <div class="grid grid-cols-3 gap-2 mb-2">
        <div>
          <label class="text-xs text-slate-500">금액</label>
          <input id="pf-amount" type="number" placeholder="0" class="w-full border border-slate-200 rounded px-2 py-1 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-500">결제일</label>
          <input id="pf-date" type="date" value="${today()}" class="w-full border border-slate-200 rounded px-2 py-1 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-500">메모</label>
          <input id="pf-note" type="text" placeholder="선급금, 잔금..." class="w-full border border-slate-200 rounded px-2 py-1 text-sm">
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="document.getElementById('pay-form').classList.add('hidden')" class="text-xs px-3 py-1 border border-slate-200 rounded hover:bg-slate-50">취소</button>
        <button onclick="guard(this, submitPayment)" class="text-xs px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">등록</button>
      </div>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      ${curPayments.length === 0 ? '<div class="p-4 text-center text-slate-400 text-sm">결제 내역 없음</div>' :
        `<table class="w-full text-xs">
          <thead class="bg-slate-50"><tr>
            <th class="p-2 text-left font-medium text-slate-500">결제일</th>
            <th class="p-2 text-right font-medium text-slate-500">금액</th>
            <th class="p-2 text-left font-medium text-slate-500">메모</th>
            <th class="p-2 w-8"></th>
          </tr></thead>
          <tbody>${curPayments.map(p=>`
            <tr class="border-t border-slate-50">
              <td class="p-2">${esc(p.paid_at||'—')}</td>
              <td class="p-2 text-right font-semibold text-red-700">${(p.amount||0).toLocaleString()}원</td>
              <td class="p-2 text-slate-500">${esc(p.note||'')}</td>
              <td class="p-2 text-center"><button onclick="delPayment(${p.id})" class="text-slate-300 hover:text-red-400">×</button></td>
            </tr>`).join('')}
          </tbody>
        </table>`}
    </div>
  `;
}

function showPayForm() { document.getElementById('pay-form').classList.remove('hidden'); }

async function submitPayment() {
  const amount = parseInt(document.getElementById('pf-amount').value);
  if (!amount) return alert('금액을 입력하세요.');
  await api.post('/api/purchase_payments', {
    purchase_id: curId, amount, paid_at: document.getElementById('pf-date').value, note: document.getElementById('pf-note').value
  });
  curPayments = await api.get(`/api/purchase_payments/purchase/${curId}`);
  purchases = await api.get('/api/purchases');
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  renderPaymentsTab(document.getElementById('tab-content'));
}

async function delPayment(id) {
  if (!confirm('삭제할까요?')) return;
  await api.del(`/api/purchase_payments/${id}`);
  curPayments = await api.get(`/api/purchase_payments/purchase/${curId}`);
  purchases = await api.get('/api/purchases');
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  renderPaymentsTab(document.getElementById('tab-content'));
}

function renderReceiptsTab(tc) {
  const purchase = purchases.find(p => p.id === curId);
  const canReceive = purchase && ['ordered','partial'].includes(purchase.purchase_status);
  tc.innerHTML = `
    <div class="text-sm font-semibold mb-3">입고 처리</div>
    ${!curItems.length ? '<div class="text-sm text-slate-400">품목을 먼저 등록하세요.</div>' :
    `<div class="bg-white rounded-xl border border-slate-200 overflow-hidden mb-4">
      <table class="w-full text-xs">
        <thead class="bg-slate-50"><tr>
          <th class="p-2 text-left font-medium text-slate-500">품목</th>
          <th class="p-2 text-right font-medium text-slate-500">발주</th>
          <th class="p-2 text-right font-medium text-slate-500">입고완료</th>
          <th class="p-2 text-right font-medium text-slate-500">잔여</th>
          ${canReceive ? '<th class="p-2 text-right font-medium text-slate-500">이번 입고</th><th class="p-2"></th>' : ''}
        </tr></thead>
        <tbody>${curItems.map(it => {
          const remain = (it.qty||0) - (it.received_qty||0);
          return `<tr class="border-t border-slate-50">
            <td class="p-2">${esc(it.name)}<br><span class="text-slate-400">${esc(it.spec||'')}</span></td>
            <td class="p-2 text-right">${qty(it.qty)} ${esc(it.unit)}</td>
            <td class="p-2 text-right text-blue-600">${it.received_qty||0}</td>
            <td class="p-2 text-right ${remain>0?'text-orange-600':'text-slate-400'}">${remain}</td>
            ${canReceive ? `<td class="p-2"><input type="number" id="recv-${it.id}" min="0" max="${remain}" step="0.01" value="0" style="width:70px;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;text-align:right"></td>
            <td class="p-2"><button onclick="guard(this, () => submitReceiptItem(${it.id},${curId}))" class="text-xs px-2 py-1 bg-purple-600 text-white rounded hover:bg-purple-700">입고</button></td>` : ''}
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`}
  `;
}

async function submitReceiptItem(itemId, purchaseId) {
  const n = parseFloat(document.getElementById(`recv-${itemId}`).value);
  if (!(n > 0)) return toast('수량을 입력하세요.', 'error');
  const it = curItems.find(x => x.id === itemId);
  const remain = (it?.qty || 0) - (it?.received_qty || 0);
  if (n > remain) return toast(`잔여 수량 ${qty(remain)} 을 초과했습니다.`, 'error');
  if (!await tryApi(() => api.post('/api/purchase_receipts', {
    purchase_id: purchaseId, item_id: itemId, qty: n, received_at: today() }), '입고됐습니다.')) return;
  [curItems, purchases] = await Promise.all([
    api.get(`/api/purchase_items/purchase/${purchaseId}`),
    api.get('/api/purchases'),
  ]);
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  renderReceiptsTab(document.getElementById('tab-content'));
  await selectPurchase(purchaseId);
}

async function advanceStatus(id, next) {
  if (!confirm(`"${STATUS_LABEL[next]}" 상태로 변경할까요?`)) return;
  if (!await tryApi(() => api.patch(`/api/purchases/${id}/status`, { status:next }))) return;
  await reloadPurchases(id);
}

// ─── 거래 취소 ───────────────────────────────────────────────
let cancelTargetId = null;
function openCancelModal(id) {
  cancelTargetId = id;
  document.getElementById('cancel-reason').value = '';
  document.getElementById('cancel-modal').classList.remove('hidden');
}
function closeCancelModal() { document.getElementById('cancel-modal').classList.add('hidden'); cancelTargetId = null; }

async function submitCancel() {
  const id = cancelTargetId;          // closeCancelModal() 이 null 로 만들므로 먼저 받아둔다
  if (!id) return;
  const reason = document.getElementById('cancel-reason').value.trim();
  if (!reason) return toast('취소 사유를 입력하세요.', 'error');
  if (!confirm('이 발주를 취소할까요?')) return;
  if (!await tryApi(() => api.patch(`/api/purchases/${id}/cancel`, { reason }), '취소됐습니다.')) return;
  closeCancelModal();
  await reloadPurchases(id);
}

async function uncancelPurchase(id) {
  if (!confirm('취소를 해제할까요?')) return;
  if (!await tryApi(() => api.patch(`/api/purchases/${id}/uncancel`), '취소가 해제됐습니다.')) return;
  await reloadPurchases(id);
}

async function deletePurchase(id) {
  const p = purchases.find(x => x.id === id);
  if (!confirm(`${p?.no || '#'+id} 발주를 삭제할까요?\n품목·입고·지급 기록이 함께 사라지며 되돌릴 수 없습니다.`)) return;
  if (!await tryApi(() => api.del(`/api/purchases/${id}`), '삭제됐습니다.')) return;
  curId = null;
  await reloadPurchases(null);
}

async function reloadPurchases(selectId) {
  purchases = await api.get('/api/purchases');
  purchases.sort((a,b) => b.id - a.id);
  renderList();
  if (selectId) return selectPurchase(selectId);
  document.getElementById('detail-content').classList.add('hidden');
  document.getElementById('empty-state').classList.remove('hidden');
}

function openNewModal() {
  // 번호는 비워 두면 서버가 매긴다 (화면에서 세면 다른 사람이 만든 건을 몰라 겹친다)
  document.getElementById('new-no').value = '';
  document.getElementById('new-modal').classList.remove('hidden');
}
function closeNewModal() { document.getElementById('new-modal').classList.add('hidden'); }

async function createPurchase() {
  const vendor = document.getElementById('new-vendor').value.trim();
  if (!vendor) return alert('공급업체명을 입력하세요.');
  // 번호가 비면 서버가 매긴다. 상태·총액도 서버가 정한다.
  const ok = await tryApi(() => api.post('/api/purchases', {
    no: document.getElementById('new-no').value,
    date: document.getElementById('new-date').value,
    vendor,
    vendor_id: document.getElementById('new-vendor-sel').value||'',
    items: document.getElementById('new-memo').value,
  }));
  if (!ok) return;
  closeNewModal();
  await reloadPurchases(null);
  if (purchases.length) selectPurchase(purchases[0].id);
}

init();
</script>
</body>
</html>
